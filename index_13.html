function ghPayload() {
  const c = Object.assign({}, st);
  delete c.base;                       // die öffentliche Adresse ist gerätespezifisch
  return JSON.stringify(c, null, 1);
}
function ghSay(ok, msg) { ghInfo = { ok, msg, at: Date.now() }; }

async function ghPull() {
  if (!ghReady()) return false;
  try {
    const r = await fetch(ghRaw(), { cache: 'no-store' });
    if (r.status === 404) { ghHas = false; ghSay(true, 'Datei noch nicht angelegt'); return false; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const raw = await r.json();
    ghHas = true;
    ghSay(true, 'gelesen um ' + hhmm(nowMin()));
    if (raw && (raw.ts || 0) > (st.ts || 0)) {
      const base = st.base;
      st = merge(raw); st.base = base;
      return true;
    }
  } catch (e) { ghSay(false, 'Lesen fehlgeschlagen (' + e.message + ')'); }
  return false;
}

async function ghPushNow(quiet) {
  if (!ghReady() || RO || ghBusy) return false;
  const tok = ghToken();
  if (!tok) { ghSay(false, 'Kein Zugriffsschlüssel hinterlegt'); if (!quiet) render(); return false; }
  ghBusy = true;
  const hdr = { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json' };
  try {
    let sha = null;
    const g = await fetch(ghApi() + '?ref=' + st.gh.branch, { headers: hdr, cache: 'no-store' });
    if (g.ok) { const j = await g.json(); sha = j.sha; }
    else if (g.status === 401) throw new Error('Schlüssel ungültig oder abgelaufen');
    else if (g.status === 403) throw new Error('Schlüssel hat keine Rechte auf dieses Repository');
    else if (g.status !== 404) throw new Error('HTTP ' + g.status);
    const body = {
      message: 'Turnierstand ' + new Date().toISOString().slice(0, 16).replace('T', ' '),
      content: b64plain(ghPayload()), branch: st.gh.branch,
    };
    if (sha) body.sha = sha;
    const p = await fetch(ghApi(), { method: 'PUT', headers: hdr, body: JSON.stringify(body) });
    if (!p.ok) {
      if (p.status === 401) throw new Error('Schlüssel ungültig oder abgelaufen');
      if (p.status === 403) throw new Error('Schlüssel darf nicht schreiben');
      if (p.status === 409) throw new Error('Gleichzeitige Änderung, bitte erneut senden');
      throw new Error('HTTP ' + p.status);
    }
    ghHas = true;
    ghSay(true, 'gesendet um ' + hhmm(nowMin()));
    ghBusy = false; if (!quiet) render();
    return true;
  } catch (e) {
    ghSay(false, 'Senden fehlgeschlagen: ' + e.message);
    ghBusy = false; if (!quiet) render();
    return false;
  }
}
function ghSchedulePush() {
  if (SNAP || RO || !ghReady() || !ghToken()) return;
  clearTimeout(ghPushTimer);
  ghPushTimer = setTimeout(() => ghPushNow(false), 2500);
}

/* ================= Snapshot im Link ================= */
function b64e(str) {
  const b = new TextEncoder().encode(str);
  let s = ''; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64d(str) {
  const s = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
  const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return new TextDecoder().decode(b);
}
const p2 = v => (v === null || v === undefined || v === '') ? '--' : String(v).padStart(2, '0').slice(-2);
const u2 = s => { if (s === '--' || s.trim() === '') return null; const v = parseInt(s, 10); return Number.isFinite(v) ? v : null; };

function encodeState(s) {
  const L = [
    '4', s.title, s.date,
    [s.start, s.dGroup, s.pGroup, s.lunch, s.prepSlots, s.dQuarter, s.dSemi, s.dFinal, s.pFinal,
     s.courts, s.win, s.draw, s.loss, s.mode === 'mixed' ? 1 : 0,
     s.qf ? 1 : 0, s.hf ? 1 : 0, s.kf ? 1 : 0].join(';'),
    s.sizes.join(','),
    s.names.map(a => a.join('|')).join('\u0001'),
    s.res.map(a => a.map(r => r ? p2(r[0]) + p2(r[1]) : '----').join('')).join(','),
    s.rF.map(m => m.map(x => x ? p2(x[0]) + p2(x[1]) : '----').join('')).join(','),
    String(s.ts || 0), s.club, s.pwSalt || '', s.pwHash || '',
    [s.gh.on ? 1 : 0, s.gh.owner, s.gh.repo, s.gh.branch, s.gh.path].join('|'),
    s.pauseAfter,
    (s.refs || []).map(p => [p.n, p.f, p.t, p.tm, p.r || 'b'].join('~')).join('|'),
    dutyLine(s),
  ];
  return b64e(L.join('\n'));
}
function pull(str, cnt) {
  const out = [];
  for (let i = 0; i < cnt; i++) {
    const c = str.substr(i * 4, 4);
    const a = u2(c.substr(0, 2)), b = u2(c.substr(2, 2));
    out.push((c === '----' || a === null || b === null) ? null : [a, b]);
  }
  return out;
}
/* Ältere Snapshots hatten vier Endrundenspiele (HF1, HF2, kl. Final, Final).
   Sie liegen jetzt auf den Positionen 4 bis 7. */
function liftKO(old) {
  const out = Array.from({ length: 8 }, () => [null, null, null]);
  (old || []).slice(0, 4).forEach((m, i) => { out[4 + i] = m; });
  return out;
}
/* Einteilung positionsbasiert kodieren: Personen reisen im selben Snapshot mit */
function dutyLine(s) {
  const idx = {};
  (s.refs || []).forEach((p, i) => { idx[p.id] = i; });
  const keys = Object.keys(s.duty || {}).sort();
  return keys.map(k => k + ':' + (s.duty[k] || []).map(x => (x && idx[x] !== undefined) ? idx[x].toString(36) : '').join(',')).join(';');
}
function dutyFromLine(line, refs) {
  const out = {};
  if (!line) return out;
  line.split(';').forEach(part => {
    const i = part.indexOf(':');
    if (i < 0) return;
    const key = part.slice(0, i);
    const v = part.slice(i + 1).split(',').slice(0, 3)
      .map(x => (x === '' ? null : ((refs[parseInt(x, 36)] || {}).id || null)));
    while (v.length < 3) v.push(null);
    if (v.some(Boolean)) out[key] = v;
  });
  return out;
}
function refsFromLine(line) {
  if (!line) return [];
  return line.split('|').filter(Boolean).map((p, i) => {
    const x = p.split('~');
    return { id: 'p' + (i + 1), n: x[0] || '', f: +x[1] || 0, t: +x[2] || 0, tm: x[3] || '', r: x[4] || 'b' };
  });
}
function ghFromLine(line) {
  if (!line) return undefined;
  const p = line.split('|');
  return { on: p[0] === '1', owner: p[1] || '', repo: p[2] || '', branch: p[3] || 'main', path: p[4] || 'data.json' };
}
function decodeState(code) {
  const L = b64d(code).split('\n');
  if (!['1', '2', '3', '4'].includes(L[0])) throw new Error('Unbekanntes Snapshot-Format');
  const n = L[3].split(';').map(Number);
  if (L[0] === '4') {
    const sizes = L[4].split(',').map(Number);
    return merge({
      title: L[1], date: L[2],
      start: n[0], dGroup: n[1], pGroup: n[2], lunch: n[3], prepSlots: n[4], dQuarter: n[5],
      dSemi: n[6], dFinal: n[7], pFinal: n[8], courts: n[9], win: n[10], draw: n[11], loss: n[12],
      mode: n[13] ? 'mixed' : 'block', qf: !!n[14], hf: !!n[15], kf: !!n[16],
      sizes, names: L[5].split('\u0001').map(x => x.split('|')),
      res: sizes.map((sz, g) => pull((L[6].split(','))[g] || '', sz * (sz - 1) / 2)),
      rF: L[7].split(',').map(m => pull(m, 3)),
      ts: Number(L[8] || 0), club: L[9] === undefined ? DEFAULTS.club : L[9],
      pwSalt: L[10] || '', pwHash: L[11] || '', gh: ghFromLine(L[12]),
      pauseAfter: L[13] || 'g0',
      refs: refsFromLine(L[14]), duty: dutyFromLine(L[15], refsFromLine(L[14])),
    });
  }
  if (L[0] === '3') {
    const sizes = L[4].split(',').map(Number);
    const names = L[5].split('\u0001').map(x => x.split('|'));
    const resParts = L[6].split(',');
    return merge({
      title: L[1], date: L[2],
      start: n[0], dGroup: n[1], pGroup: n[2], lunch: n[3], lunchAfter: n[4], dSemi: n[5],
      dFinal: n[6], pFinal: n[7], courts: n[8], win: n[9], draw: n[10], loss: n[11],
      mode: n[12] ? 'mixed' : 'block',
      sizes, names,
      res: sizes.map((sz, g) => pull(resParts[g] || '', sz * (sz - 1) / 2)),
      rF: liftKO(L[7].split(',').map(m => pull(m, 3))),
      dQuarter: n[5], qf: false, hf: true, kf: true, pauseAfter: 'g0',
      ts: Number(L[8] || 0), club: L[9] === undefined ? DEFAULTS.club : L[9],
      pwSalt: L[10] || '', pwHash: L[11] || '',
    });
  }
  // Version 1 und 2: feste Struktur 6 + 7
  return merge({
    title: L[1], date: L[2],
    start: n[0], dGroup: n[1], pGroup: n[2], lunch: n[3], dSemi: n[4], dFinal: n[5],
    pFinal: n[6], courts: n[7], win: n[8], draw: n[9], loss: n[10],
    mode: 'block', lunchAfter: 5,
    sizes: [6, 7], names: [L[4].split('|'), L[5].split('|')],
    res: [pull(L[6], 15), pull(L[7], 21)],
    rF: liftKO(L[8].split('|').map(m => pull(m, 3))),
    dQuarter: n[4], qf: false, hf: true, kf: true, pauseAfter: 'g0',
    ts: Number(L[9] || 0), club: L[10] === undefined ? DEFAULTS.club : L[10],
    pwSalt: L[11] || '', pwHash: L[12] || '',
  });
}

/* ================= Hilfen ================= */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clean = v => String(v == null ? '' : v).replace(/[|\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const $ = s => document.querySelector(s);

function flash(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0C1A22;' +
    'color:#fff;padding:10px 16px;border-radius:8px;z-index:99;font-size:14px;max-width:90vw;text-align:center';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* Wie viele Spiele sind erfasst? */
function progress(s) {
  const ids = bracketPlan(s).games.map(g => g.id);
  let done = 0;
  s.res.forEach(g => g.forEach(r => { if (r) done++; }));
  ids.forEach(i => { if ((s.rF[i] || []).some(x => x)) done++; });
  const total = totalGroupMatches(s) + ids.length;
  return { done, total, pct: total ? Math.round(done / total * 100) : 0 };
}

/* ================= QR als SVG ================= */
function qrSVG(text, level) {
  let m;
  try { m = qrMatrix(text, level || 'L'); }
  catch (e) { return '<p class="muted">' + esc(e.message) + '</p>'; }
  const n = m.length, q = 4, size = n + 2 * q;
  let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
    if (m[y][x]) d += `M${x + q} ${y + q}h1v1h-1z`;
  return `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" role="img" aria-label="QR-Code">` +
    `<rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#0C1A22"/></svg>`;
}

/* Ein chronologischer Ablauf, den Ansicht und Excel-Export gemeinsam nutzen */
function planItems(s, fr) {
  const list = [];
  s.matches.forEach(m => list.push({
    t: 'm', key: 'g' + m.g + '-' + m.idx, stage: 'g' + m.g, from: m.from, to: m.to, court: m.court,
    phase: 'Gruppe ' + GL(m.g) + ' · Runde ' + (m.round + 1),
    a: m.nameA, b: m.nameB, src: '',
    res: m.res ? m.res[0] + ':' + m.res[1] : '',
  }));
  fr.games.forEach(g => list.push({
    t: 'm', key: 'f' + g.id, stage: g.stage, from: g.from, to: g.to, court: g.court, phase: g.label.replace(/ · Platz .*/, ''),
    a: g.nameA, b: g.nameB, src: g.srcA + ' / ' + g.srcB,
    res: g.ev.played ? g.ev.sa + ':' + g.ev.sb : '',
  }));
  list.sort((x, y) => x.from - y.from || x.court - y.court);
  if (s.lunchFrom !== null) {
    const row = { t: 'p', from: s.lunchFrom, to: s.lunchTo, phase: 'Pause', a: '', b: '', src: '', res: '' };
    const i = list.findIndex(x => x.from >= s.lunchTo);
    if (i < 0) list.push(row); else list.splice(i, 0, row);
  }
  return list;
}

/* ================= Ansichten ================= */
function ribbon(s) {
  const t0 = s.groupStart, t1 = s.end, span = Math.max(1, t1 - t0);
  const segs = [];
  if (s.lunchFrom !== null) {
    segs.push({ c: 'a', t: 'Gruppen 1. Teil', f: t0, o: s.lunchFrom });
    segs.push({ c: 'l', t: 'Pause', f: s.lunchFrom, o: s.lunchTo });
    segs.push({ c: 'b', t: 'Gruppen 2. Teil', f: s.lunchTo, o: s.groupEnd });
  } else {
    segs.push({ c: 'a', t: 'Gruppenphase', f: t0, o: s.groupEnd });
  }
  segs.push({ c: 'f', t: 'Finalrunde', f: s.groupEnd, o: t1 });
  const now = nowMin();
  const marker = (now > t0 && now < t1)
    ? `<div class="now" style="left:${((now - t0) / span * 100).toFixed(2)}%"></div>` : '';
  const p = progress(st);
  const mid = s.lunchFrom !== null
    ? `Pause ${hhmm(s.lunchFrom)} · Final ${hhmm(s.F[3].from)}`
    : `Final ${hhmm(s.F[3].from)}`;
  return `<div class="ribbon">
    <div class="cap"><h2>Turniertag</h2>
      <span class="prog">${p.done} von ${p.total} Spielen erfasst</span></div>
    <div class="bars">${segs.map(g =>
      `<div class="seg ${g.c}" style="width:${((g.o - g.f) / span * 100).toFixed(2)}%" `
      + `title="${esc(g.t)} ${hhmm(g.f)}–${hhmm(g.o)}">`
      + `${(g.o - g.f) / span > .13 ? esc(g.t) : ''}</div>`).join('')}${marker}</div>
    <div class="lbl"><span>Start ${hhmm(t0)}</span><span>${mid}</span><span>Ende ${hhmm(t1)}</span></div>
    <div class="track"><i style="width:${p.pct}%"></i></div>
  </div>`;
}

function matchRow(m, kind) {
  const played = kind === 'g' ? !!m.res : m.ev.played;
  let sc;
  if (kind === 'g') {
    sc = m.res ? `${m.res[0]}<span class="muted">:</span>${m.res[1]}` : '–&#8202;:&#8202;–';
  } else {
    sc = m.ev.played ? `${m.ev.sa}<span class="muted">:</span>${m.ev.sb}` : '–&#8202;:&#8202;–';
  }
  const live = nowMin() >= m.from && nowMin() < m.to;
  let wa = '', wb = '';
  if (kind === 'g' && m.res) { if (m.res[0] > m.res[1]) wa = 'b'; else if (m.res[1] > m.res[0]) wb = 'b'; }
  if (kind === 'f' && m.ev.winner) { if (m.ev.winner === m.nameA) wa = 'b'; else wb = 'b'; }
  const tag = RO ? 'div' : 'button';
  const attr = RO ? '' : ` type="button" data-edit="${kind === 'g' ? 'g' + m.g + '-' + m.idx : 'f' + m.id}"`;
  return `<${tag} class="match${live ? ' live' : ''}${played ? ' done' : ''}"${attr}>
    <div class="when">${hhmm(m.from)}<div class="ct">Feld ${m.court}</div></div>
    <div class="who">
      <span>${wa ? '<b>' : ''}${esc(m.nameA)}${wa ? '</b>' : ''}</span>
      <span class="vs">gegen</span>
      <span>${wb ? '<b>' : ''}${esc(m.nameB)}${wb ? '</b>' : ''}</span>
    </div>
    <div class="sc mono${played ? '' : ' empty'}">${sc}</div>
  </${tag}>`;
}

function viewJetzt(s, fr) {
  const all = s.matches.map(m => ({ m, k: 'g' })).concat(fr.games.map(m => ({ m, k: 'f' })));
  const n = nowMin();
  const live = all.filter(x => n >= x.m.from && n < x.m.to);
  const next = all.filter(x => x.m.from > n).sort((a, b) => a.m.from - b.m.from).slice(0, 3);

  let h = ribbon(s);
  if (live.length) {
    h += `<section><div class="hd"><h2>Läuft jetzt</h2><span class="note">${hhmm(n)}</span></div>
      <div class="live-wrap">${live.map(x => `<div class="livecard">
        <div class="k">Feld ${x.m.court} · bis ${hhmm(x.m.to)}</div>
        <div class="t">${esc(x.m.nameA)}<br>${esc(x.m.nameB)}</div>
        <div class="m">${x.k === 'f' ? esc(x.m.label) : 'Gruppe ' + GL(x.m.g) + ' · Runde ' + (x.m.round + 1)}</div>
      </div>`).join('')}</div></section>`;
  } else {
    const done = n >= s.end, early = n < s.groupStart;
    h += `<section><div class="info"><b>${done ? 'Turnier beendet.' : early ? 'Turnier startet um ' + hhmm(s.groupStart) + '.' : 'Gerade Pause.'}</b>
      ${done ? 'Die Schlussrangliste steht im Reiter «Rangliste».' : next.length ? 'Nächster Anpfiff um ' + hhmm(next[0].m.from) + '.' : ''}</div></section>`;
  }
  if (next.length) {
    h += `<section><div class="hd"><h2>Als Nächstes</h2></div>
      <div class="card">${next.map(x => matchRow(x.m, x.k)).join('')}</div></section>`;
  }
  h += `<section><div class="hd"><h2>Spitze der Gruppen</h2><span class="note">Zwischenstand</span></div>
    <div class="grid">
      ${fr.tabs.map((rows, g) => `<div class="tw"><table>
        <thead><tr><th>#</th><th>Gruppe ${GL(g)}</th><th>Sp</th><th>Pkt</th><th>+/−</th></tr></thead>
        <tbody>${rows.slice(0, 3).map(r => `<tr><td>${r.rank}</td><td>${esc(r.name)}</td><td>${r.sp}</td><td>${r.pts}</td><td>${r.diff > 0 ? '+' : ''}${r.diff}</td></tr>`).join('')}</tbody>
      </table></div>`).join('')}
    </div></section>`;
  return h;
}

function refName(id) {
  const p = (st.refs || []).find(x => x.id === id);
  return p ? p.n : null;
}
function viewPlan(s, fr) {
  const items = planItems(s, fr);
  const stats = dutyStats(st, s, fr);
  const hasRefs = (st.refs || []).filter(p => p.n).length > 0;
  const cell = (key, r) => {
    const id = ((st.duty || {})[key] || [])[r];
    const n = refName(id);
    return n ? esc(n) : '<span class="offen">—</span>';
  };
  let rows = '', lastFrom = null;
  items.forEach(it => {
    if (it.t === 'p') {
      rows += `<tr class="pause"><td colspan="${hasRefs ? 10 : 7}">${esc(it.phase)} · ${hhmm(it.from)} – ${hhmm(it.to)}</td></tr>`;
      lastFrom = null; return;
    }
    const neu = it.from !== lastFrom;
    lastFrom = it.from;
    rows += `<tr${neu ? ' class="blockstart"' : ''}>
      <td>${neu ? hhmm(it.from) + '<span class="muted"> – ' + hhmm(it.to) + '</span>' : ''}</td>
      <td>${it.court}</td>
      <td class="ph">${esc(it.phase)}${it.src ? '<br><span class="muted src">' + esc(it.src) + '</span>' : ''}</td>
      <td class="tm">${esc(it.a)}</td>
      <td class="tm">${esc(it.b)}</td>
      <td>${it.res || '<span class="muted">–</span>'}</td>
      ${hasRefs ? `<td class="du">${cell(it.key, 0)}</td><td class="du">${cell(it.key, 1)}</td><td class="du">${cell(it.key, 2)}</td>
      ${RO ? '' : `<td class="no-print"><button type="button" class="mini" data-duty="${it.key}">ändern</button></td>`}` : ''}
    </tr>`;
  });
  const warn = hasRefs && stats.open
    ? `<div class="info" style="border-left-color:var(--warn)"><b>${stats.open} von ${stats.total} Posten sind unbesetzt.</b>
        Es fehlen Personen, die zu diesen Zeiten verfügbar sind – erweitere die Einsatzfenster oder trage weitere Helfer ein.</div>`
    : '';
  return `<section><div class="hd"><h2>Zeitplan</h2>
      <span class="note">${items.filter(i => i.t === 'm').length} Spiele · ${hhmm(s.groupStart)} bis ${hhmm(s.end)}</span></div>
    <div class="row no-print" style="margin-bottom:10px">
      <button class="btn" id="btnXlsx">Als Excel herunterladen</button>
      <button class="btn" id="btnPdf">Als PDF herunterladen</button>
      <button class="btn ghost" id="btnPrint">Drucken</button>
      ${RO ? '' : `<button class="btn ghost" id="btnDuty">Einteilung erzeugen</button>`}
    </div>
    ${warn}
    ${hasRefs ? '' : '<div class="info no-print">Noch keine Schiedsrichter und Täfeler erfasst. Trage sie unter <b>Einstellungen → Schiedsrichter und Täfeler</b> ein; danach erscheinen hier drei zusätzliche Spalten.</div>'}
    <div class="tw" style="margin-top:10px"><table class="plan">
      <thead><tr><th>Zeit</th><th>Feld</th><th>Phase</th><th>Team 1</th><th>Team 2</th><th>Res.</th>
        ${hasRefs ? '<th>Schiedsrichter</th><th>Täfeler 1</th><th>Täfeler 2</th>' + (RO ? '' : '<th class="no-print"></th>') : ''}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <p class="muted" style="margin-top:9px"><small>Die Paarungen der Endrunde stehen erst fest, wenn die
      Gruppenphase gespielt ist; bis dahin zeigt der Plan die Herkunft der Teilnehmer.</small></p>
  </section>
  ${hasRefs ? `<section><div class="hd"><h2>Einsätze je Person</h2>
      <span class="note">${stats.total - stats.open} von ${stats.total} Posten besetzt</span></div>
    <div class="tw"><table>
      <thead><tr><th>Person</th><th style="text-align:left">Rolle</th><th>verfügbar</th><th>Einsätze</th><th>SR</th><th>Täf. 1</th><th>Täf. 2</th><th style="text-align:left">spielt in</th></tr></thead>
      <tbody>${stats.rows.map(r => `<tr><td style="text-align:left;font-family:var(--cond);font-size:15px;font-weight:600;color:var(--ink)">${esc(r.n)}</td>
        <td style="text-align:left;font-family:var(--sans);font-size:12.5px">${ROLE_SHORT[r.r]}</td>
        <td>${hhmm(r.f)}–${hhmm(r.t)}</td><td><b>${r.cnt}</b></td>
        <td>${r.byRole[0]}</td><td>${r.byRole[1]}</td><td>${r.byRole[2]}</td>
        <td style="text-align:left;font-family:var(--sans);font-size:12.5px" class="muted">${r.tm ? esc(teamLabel(r.tm)) : '—'}</td></tr>`).join('')}</tbody>
    </table></div></section>` : ''}`;
}

function teamLabel(tm) {
  const p = String(tm).split('-').map(Number);
  const n = (st.names[p[0]] || [])[p[1]];
  return n ? `${n} (Gruppe ${GL(p[0])})` : '—';
}

function viewGroup(s, fr, g) {
  const list = s.byGroup[g] || [];
  const tab = fr.tabs[g] || [];
  const size = st.sizes[g];
  let rows = '', last = -1;
  list.slice().sort((a, b) => a.from - b.from || a.court - b.court).forEach(m => {
    if (m.round !== last) { rows += `<div class="roundhead">Runde ${m.round + 1}</div>`; last = m.round; }
    rows += matchRow(m, 'g');
  });
  const note = size % 2 ? 'Pro Runde pausiert ein Team.' : 'Alle Teams spielen in jeder Runde.';
  return `<section><div class="hd"><h2>Gruppe ${GL(g)}</h2>
      <span class="note">${size} Teams · ${list.length} Spiele · 1 Satz · ${note}</span></div>
    <div class="card">${rows || '<div class="roundhead">Keine Spiele</div>'}</div>
    ${RO ? '' : '<p class="muted"><small>Spiel antippen, um das Resultat zu erfassen.</small></p>'}</section>
  <section><div class="hd"><h2>Tabelle ${GL(g)}</h2>
      <span class="note">Punkte · Differenz · erzielte Punkte</span></div>
    <div class="tw"><table>
      <thead><tr><th>#</th><th>Team</th><th>Sp</th><th>S</th><th>U</th><th>N</th><th>Pkt</th><th>+</th><th>−</th><th>+/−</th></tr></thead>
      <tbody>${tab.map(r => `<tr><td>${r.rank}</td><td>${esc(r.name)}</td><td>${r.sp}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td><b>${r.pts}</b></td><td>${r.pf}</td><td>${r.pa}</td><td>${r.diff > 0 ? '+' : ''}${r.diff}</td></tr>`).join('')}</tbody>
    </table></div></section>`;
}

function viewFinal(s, fr) {
  const plan = s.plan;
  const stageName = { qf: 'Viertelfinals', hf: 'Halbfinals', kf: 'Kleiner Final', fin: 'Final' };
  let rows = '';
  ['qf', 'hf', 'kf', 'fin'].forEach(stg => {
    const gs = fr.games.filter(g => g.stage === stg);
    if (!gs.length) return;
    rows += `<div class="roundhead">${stageName[stg]}</div>`;
    gs.forEach(g => { rows += matchRow(g, 'f'); });
  });
  const parts = [];
  if (plan.qf) parts.push('Viertelfinals');
  if (plan.hf) parts.push('Halbfinals');
  if (plan.kf) parts.push('kleiner Final');
  if (plan.fin) parts.push('Final');

  return `<section><div class="hd"><h2>Finalrunde</h2>
      <span class="note">${parts.join(' · ') || 'keine Endrunde'} · ${plan.need} Qualifizierte</span></div>
    ${plan.off.length ? `<div class="info"><b>Nicht gespielt:</b> ${esc(plan.off.join(', '))}.</div>` : ''}
    <div class="card">${rows || '<div class="roundhead">Keine Endrunde</div>'}</div></section>
  <section><div class="card">
    ${fr.games.map(g => `<div class="match" style="grid-template-columns:1fr">
      <div><div class="when" style="font-size:11px;letter-spacing:.06em;text-transform:uppercase">${esc(g.label)} · ${hhmm(g.from)}–${hhmm(g.to)} · Feld ${g.court} · ${g.nSets} Sätze</div>
      <div class="who" style="font-size:17px;margin-top:4px">${esc(g.nameA)} <span class="vs" style="display:inline">gegen</span> ${esc(g.nameB)}</div>
      <div class="mono muted" style="font-size:12px;margin-top:4px">${esc(g.srcA)} · ${esc(g.srcB)}${g.ev.played ? ' — Sätze ' + g.ev.sa + ':' + g.ev.sb + ' (' + g.ev.ta + ':' + g.ev.tb + ' Punkte)' : ''}</div>
      ${g.ev.tie ? '<div class="mono" style="color:var(--warn,#A32100);font-size:12px">Gleichstand – Entscheidung offen</div>' : ''}
      ${g.ev.winner ? '<div class="mono" style="color:var(--ok);font-size:12px;margin-top:2px">Sieger: ' + esc(g.ev.winner) + '</div>' : ''}
      </div></div>`).join('')}
  </div></section>
  ${fr.done ? '' : '<div class="info"><b>Die Paarungen stehen noch nicht fest.</b> Solange nicht jede Gruppenpartie erfasst ist, zeigt die Endrunde nur die Setzplätze – Namen wären an dieser Stelle geraten.</div>'}
  <div class="info">Qualifiziert sind die ${plan.need} besten Teams über alle Gruppen: zuerst zählt der Gruppenrang, dann Punkte pro Spiel. Gesetzt wird ${plan.qf ? '1–8, 4–5, 2–7 und 3–6' : plan.hf ? '1 gegen 4 und 2 gegen 3' : '1 gegen 2'}; die App dreht die Paarungen, um Gruppenduelle möglichst zu vermeiden.</div>
  <div class="info">Viertel- und Halbfinals gehen über 2 Sätze; bei 1:1 entscheidet die Gesamtpunktzahl. Kleiner Final und Final gehen über 3 Sätze, der dritte nur bei 1:1.</div>`;
}

function viewRang(s, fr) {
  const r = finalRanking(st, s);
  return `<section><div class="hd"><h2>Schlussrangliste</h2>
      <span class="note">${r.enough ? 'Plätze 1–4 aus der Finalrunde' : 'nur Gruppenphase'}</span></div>
    ${r.done ? '' : '<div class="info"><b>Noch nichts entschieden.</b> Solange nicht jede Gruppenpartie erfasst ist, steht keine Platzierung fest – bei gleichem Punktestand entschiede sonst allein die Eingabereihenfolge.</div>'}
    ${r.list.some(e => e.punktgleich) ? '<div class="info" style="border-left-color:var(--warn)"><b>Punktgleichheit.</b> Mehrere Teams sind in Punkten, Differenz und erzielten Punkten nicht zu unterscheiden. Sie teilen sich die Platznummer; die Reihenfolge müsst ihr selbst festlegen.</div>' : ''}
    <div class="tw"><table>
      <thead><tr><th>#</th><th>Team</th><th>Gr.</th><th>Pkt</th><th>+/−</th><th style="text-align:left">Entschieden durch</th></tr></thead>
      <tbody>${r.list.map(e => `<tr class="${e.place <= 3 && e.name ? 'p' + e.place : ''}${e.punktgleich ? ' gleich' : ''}">
        <td>${e.place <= 3 && e.name ? '<span class="badge b' + e.place + '">' + e.place + '</span>' : e.place}</td><td>${e.name ? esc(e.name) : '<span class="muted">offen</span>'}</td>
        <td>${e.grp || '—'}</td><td>${e.pts === undefined ? '—' : e.pts}</td>
        <td>${e.diff === undefined ? '—' : (e.diff > 0 ? '+' : '') + e.diff}</td>
        <td style="text-align:left;font-family:var(--sans);font-size:12.5px;white-space:normal" class="muted">${esc(e.why)}</td></tr>`).join('')}</tbody>
    </table></div></section>
  <div class="info">Die Plätze ab ${r.enough ? '5' : '1'} werden ohne weitere Spiele aus der Gruppenphase abgeleitet: zuerst der Rang in der Gruppe, dann <b>Punkte pro Spiel</b>, dann Punktedifferenz pro Spiel. Der Bezug auf einzelne Spiele ist nötig, damit unterschiedlich grosse Gruppen vergleichbar bleiben.</div>`;
}

function fld(label, id, val, type, extra) {
  return `<div class="fld"><label for="${id}">${esc(label)}</label>
    <input id="${id}" type="${type || 'number'}" value="${esc(val)}" ${extra || ''}></div>`;
}

function viewSetup() {
  const sch = schedule(st), slots = sch.slots.length;
  const lunchTime = sch.lunchFrom !== null
    ? `(${hhmm(sch.lunchFrom)} – ${hhmm(sch.lunchTo)})` : '(entfällt)';
  return `<section><div class="hd"><h2>Turnier</h2></div><div class="grid">
      ${fld('Verein', 's_club', st.club, 'text')}
      ${fld('Titel', 's_title', st.title, 'text')}
      ${fld('Datum / Ort', 's_date', st.date, 'text', 'placeholder="z. B. 1. August, Uerkheim"')}
    </div></section>

  <section><div class="hd"><h2>Gruppen und Teams</h2>
      <span class="note">${totalTeams(st)} Teams · ${totalGroupMatches(st)} Gruppenspiele</span></div>
    <div class="grid">
      <div class="fld"><label for="s_groups">Anzahl Gruppen</label>
        <select id="s_groups">${Array.from({ length: MAXG }, (_, i) => i + 1).map(c =>
          `<option value="${c}"${st.sizes.length === c ? ' selected' : ''}>${c} Gruppe${c > 1 ? 'n' : ''}</option>`).join('')}</select></div>
      ${st.sizes.map((n, g) => `<div class="fld"><label for="s_sz${g}">Teams in Gruppe ${GL(g)}</label>
        <input id="s_sz${g}" data-size="${g}" type="number" min="${MINSZ}" max="${MAXSZ}" inputmode="numeric" value="${n}"></div>`).join('')}
    </div>
    <p class="muted" style="margin-top:8px"><small>${MINSZ} bis ${MAXSZ} Teams pro Gruppe, höchstens ${MAXG} Gruppen.
      Beim Verkleinern gehen die Resultate der wegfallenden Spiele verloren.</small></p>
  </section>

  <section><div class="hd"><h2>Ablauf der Gruppenphase</h2></div><div class="grid">
      <div class="fld"><label for="s_mode">Reihenfolge</label>
        <select id="s_mode">
          <option value="block"${st.mode === 'block' ? ' selected' : ''}>Gruppe für Gruppe (Block)</option>
          <option value="mixed"${st.mode === 'mixed' ? ' selected' : ''}>Gruppen durchmischt</option>
        </select></div>
      <div class="fld"><label for="s_pauseAfter">Pause ${lunchTime}</label>
        <select id="s_pauseAfter">
          <option value="none"${st.pauseAfter === 'none' ? ' selected' : ''}>keine Pause</option>
          ${st.sizes.map((_, g) => `<option value="g${g}"${st.pauseAfter === 'g' + g ? ' selected' : ''}>nach Abschluss von Gruppe ${GL(g)}</option>`).join('')}
          <option value="half"${st.pauseAfter === 'half' ? ' selected' : ''}>nach der halben Gruppenphase</option>
        </select></div>
    </div>
    <p class="muted" style="margin-top:8px"><small>Die Gruppenphase umfasst ${slots} Zeitblöcke.
      Im Block-Ablauf spielt jede Gruppe am Stück, durchmischt laufen die Gruppen parallel auf den Feldern.
      Die Pause hängt am Abschluss der gewählten Gruppe und verschiebt sich automatisch mit, wenn du
      Gruppengrössen, Felderzahl oder Ablauf änderst. Bei durchmischtem Ablauf enden alle Gruppen etwa
      gleichzeitig – dort passt «nach der halben Gruppenphase» meist besser. Fällt der gewählte Zeitpunkt
      ans Ende der Gruppenphase, entfällt die Pause.</small></p>
  </section>

  <section><div class="hd"><h2>Endrunde</h2>
      <span class="note">${sch.plan.games.length} Spiele · ${sch.plan.need} Qualifizierte</span></div>
    <div class="card" style="padding:12px 14px">
      <label class="check"><input type="checkbox" id="s_qf"${st.qf ? ' checked' : ''}${st.hf ? '' : ' disabled'}>
        Viertelfinal <span class="muted">— 8 Qualifizierte, 4 Spiele über 2 Sätze</span></label>
      <label class="check"><input type="checkbox" id="s_hf"${st.hf ? ' checked' : ''}>
        Halbfinal <span class="muted">— 4 Qualifizierte, 2 Spiele über 2 Sätze</span></label>
      <label class="check"><input type="checkbox" id="s_kf"${st.kf ? ' checked' : ''}${st.hf ? '' : ' disabled'}>
        Kleiner Final <span class="muted">— Spiel um Platz 3/4 über 3 Sätze</span></label>
      <label class="check" style="opacity:.6"><input type="checkbox" checked disabled>
        Final <span class="muted">— wird immer gespielt</span></label>
    </div>
    ${sch.plan.off.length ? `<div class="info" style="margin-top:9px"><b>Derzeit nicht möglich:</b> ${esc(sch.plan.off.join(', '))}.</div>` : ''}
    <p class="muted" style="margin-top:8px"><small>Viertelfinal und kleiner Final setzen das Halbfinal voraus –
      ohne Halbfinal gibt es weder acht Qualifizierte noch Halbfinalverlierer. Ohne kleinen Final werden
      die Plätze 3 und 4 nach der Setzung vergeben.</small></p>
  </section>

  <section><div class="hd"><h2>Zeiten</h2><span class="note">Minuten, ausser Startzeit</span></div><div class="grid">
      ${fld('Startzeit am Morgen', 's_start', hhmm(st.start), 'text', 'inputmode="numeric" placeholder="09:00"')}
      ${fld('Spieldauer Gruppenspiel', 's_dGroup', st.dGroup, 'number', 'min="1" inputmode="numeric"')}
      ${fld('Pause zwischen Gruppenspielen', 's_pGroup', st.pGroup, 'number', 'min="0" inputmode="numeric"')}
      ${fld('Länge der Pause', 's_lunch', st.lunch, 'number', 'min="0" inputmode="numeric"')}
      ${fld('Dauer Viertelfinal (2 Sätze)', 's_dQuarter', st.dQuarter, 'number', 'min="1" inputmode="numeric"')}
      ${fld('Dauer Halbfinal (2 Sätze)', 's_dSemi', st.dSemi, 'number', 'min="1" inputmode="numeric"')}
      ${fld('Dauer Finalspiel (3 Sätze)', 's_dFinal', st.dFinal, 'number', 'min="1" inputmode="numeric"')}
      ${fld('Pause in der Finalrunde', 's_pFinal', st.pFinal, 'number', 'min="0" inputmode="numeric"')}
      <div class="fld"><label for="s_courts">Anzahl Spielfelder</label>
        <select id="s_courts">${[1, 2, 3, 4, 5, 6].map(c => `<option value="${c}"${st.courts === c ? ' selected' : ''}>${c} Feld${c > 1 ? 'er' : ''}</option>`).join('')}</select></div>
    </div>
    <p class="muted" style="margin-top:8px"><small>Turnierende ${hhmm(sch.end)}.</small></p>
  </section>

  <section><div class="hd"><h2>Punkte</h2><span class="note">Gruppenphase</span></div><div class="grid">
      ${fld('Punkte pro Sieg', 's_win', st.win, 'number', 'inputmode="numeric"')}
      ${fld('Punkte pro Unentschieden', 's_draw', st.draw, 'number', 'inputmode="numeric"')}
      ${fld('Punkte pro Niederlage', 's_loss', st.loss, 'number', 'inputmode="numeric"')}
    </div></section>

  ${st.sizes.map((n, g) => `<section><div class="hd"><h2>Teams Gruppe ${GL(g)}</h2>
      <span class="note">${n} Teams</span></div><div class="grid">
      ${st.names[g].map((t, i) => `<div class="fld name"><label for="t${g}_${i}"><span class="code">${GL(g)}${i + 1}</span></label>
        <input id="t${g}_${i}" data-team="${g}-${i}" type="text" value="${esc(t)}"></div>`).join('')}
    </div></section>`).join('')}

  <section><div class="hd"><h2>Bearbeitung schützen</h2>
      <span class="note">${st.pwHash ? 'Passwort gesetzt' : 'kein Passwort'}</span></div>
    ${st.pwHash ? `<div class="info">Die Seite startet auf diesem und auf allen anderen Geräten im
        Lesemodus. Zum Bearbeiten wird das Passwort verlangt.</div>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost sm" id="btnPwChange">Passwort ändern</button>
        <button class="btn ghost sm" id="btnPwOff">Schutz entfernen</button>
      </div>`
    : `<div class="grid">
        <div class="fld"><label for="pwNew">Neues Passwort</label>
          <input id="pwNew" type="password" autocomplete="new-password"></div>
        <div class="fld"><label for="pwNew2">Wiederholen</label>
          <input id="pwNew2" type="password" autocomplete="new-password"></div>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn sm" id="btnPwOn">Passwort setzen</button></div>`}
    <p class="muted" style="margin-top:8px"><small>Der Schutz verhindert versehentliches Umschalten.
      Wer sich auskennt, umgeht ihn im Browser – die Seite läuft vollständig auf dem Gerät.
      Wähle trotzdem kein triviales Passwort.</small></p>
  </section>

  <section><div class="hd"><h2>Schiedsrichter und Täfeler</h2>
      <span class="note">${(st.refs || []).length} Personen · pro Partie 1 Schiedsrichter, 2 Täfeler</span></div>
    ${(st.refs || []).length ? `<div class="tw"><table class="refs">
      <thead><tr><th style="text-align:left">Name</th><th style="text-align:left">Rolle</th><th>von</th><th>bis</th><th style="text-align:left">spielt in</th><th class="no-print"></th></tr></thead>
      <tbody>${st.refs.map((p, i) => `<tr>
        <td><input data-ref="${i}-n" type="text" value="${esc(p.n)}" placeholder="Name"></td>
        <td><select data-ref="${i}-r">${['b', 's', 't'].map(r =>
          `<option value="${r}"${(p.r || 'b') === r ? ' selected' : ''}>${ROLE_LABEL[r]}</option>`).join('')}</select></td>
        <td><input data-ref="${i}-f" type="text" inputmode="numeric" value="${hhmm(p.f)}" size="5"></td>
        <td><input data-ref="${i}-t" type="text" inputmode="numeric" value="${hhmm(p.t)}" size="5"></td>
        <td><select data-ref="${i}-tm"><option value="">— keinem Team —</option>
          ${st.sizes.map((n, g) => st.names[g].map((nm, k) =>
            `<option value="${g}-${k}"${p.tm === g + '-' + k ? ' selected' : ''}>${esc(nm)} (${GL(g)})</option>`).join('')).join('')}
        </select></td>
        <td class="no-print"><button type="button" class="mini" data-refdel="${i}">entfernen</button></td>
      </tr>`).join('')}</tbody></table></div>` : '<div class="info">Noch keine Personen erfasst.</div>'}
    <div class="grid" style="margin-top:10px">
      <div class="fld"><label for="s_prep">Vorbereitungszeit vor dem eigenen Spiel</label>
        <select id="s_prep">
          <option value="0"${st.prepSlots === 0 ? ' selected' : ''}>keine – Einsatz bis unmittelbar davor möglich</option>
          <option value="1"${st.prepSlots === 1 ? ' selected' : ''}>1 Zeitblock frei</option>
          <option value="2"${st.prepSlots === 2 ? ' selected' : ''}>2 Zeitblöcke frei</option>
          <option value="3"${st.prepSlots === 3 ? ' selected' : ''}>3 Zeitblöcke frei</option>
        </select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn sm" id="refAdd">Person hinzufügen</button>
      <button class="btn ghost sm" id="refAdd5">Fünf hinzufügen</button>
      <button class="btn ghost sm" id="dutyGen">Einteilung erzeugen</button>
      <button class="btn ghost sm" id="dutyClear">Einteilung löschen</button>
    </div>
    ${(() => {
      const r = (st.refs || []).filter(p => p.n);
      if (!r.length) return '';
      const cov = dutyCoverage(st, sch, finalRound(st, sch));
      const eng = cov.fehlt > 0;
      return `<div class="info" style="margin-top:10px${eng ? ';border-left-color:var(--warn)' : ''}">
        <b>Bedarf:</b> pro Feld gleichzeitig 1 Schiedsrichter und 2 Täfeler.
        Erfasst sind ${r.filter(p => canRole(p, 0)).length} schiedsrichterfähige und
        ${r.filter(p => canRole(p, 1)).length} täfelerfähige Personen.
        ${eng
          ? `<br><b>Knappste Stelle um ${hhmm(cov.from)}:</b> nötig ${cov.needS} Schiedsrichter und ${cov.needT} Täfeler,
             verfügbar ${cov.haveS} und ${cov.haveT}. Dort bleiben ${cov.fehlt} Posten offen.
             Berücksichtigt sind Einsatzfenster und eigene Spiele.`
          : 'Zu jeder Zeit sind genügend Personen verfügbar.'}</div>`;
    })()}
    <p class="muted" style="margin-top:8px"><small>Die Einteilung berücksichtigt Rolle und Einsatzfenster, verhindert
      gleichzeitige Doppeleinsätze auf verschiedenen Feldern und teilt niemanden ein, während das eigene Team
      spielt. Mit der Vorbereitungszeit bleiben zusätzlich die davorliegenden Zeitblöcke frei, damit sich
      Spielende in Ruhe umziehen und einlaufen können. Sie wird nicht laufend neu berechnet – nach Änderungen an Personen, Zeiten oder Spielplan
      erzeugst du sie neu. Die Ergebnisse stehen im Reiter Zeitplan.</small></p>
  </section>

  <section><div class="hd"><h2>Live-Aktualisierung über GitHub</h2>
      <span class="note">${ghReady() ? (ghInfo.ok === false ? 'gestört' : 'aktiv') : 'aus'}</span></div>
    <div class="card" style="padding:12px 14px">
      <label class="check"><input type="checkbox" id="gh_on"${st.gh.on ? ' checked' : ''}>
        Live-Aktualisierung einschalten</label>
    </div>
    <div class="grid" style="margin-top:10px">
      ${fld('GitHub-Benutzername', 'gh_owner', st.gh.owner, 'text', 'placeholder="deinname" autocomplete="off"')}
      ${fld('Repository', 'gh_repo', st.gh.repo, 'text', 'placeholder="bv" autocomplete="off"')}
      ${fld('Branch', 'gh_branch', st.gh.branch, 'text', 'placeholder="main" autocomplete="off"')}
      ${fld('Dateiname', 'gh_path', st.gh.path, 'text', 'placeholder="data.json" autocomplete="off"')}

    <div class="grid" style="margin-top:10px">
      <div class="fld"><label for="gh_tok">Zugriffsschlüssel ${ghToken() ? '(hinterlegt)' : '(nicht hinterlegt)'}</label>
        <input id="gh_tok" type="password" autocomplete="off" placeholder="${ghToken() ? '•••••••• ersetzen' : 'github_pat_…'}"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn sm" id="gh_save">Schlüssel speichern</button>
      <button class="btn ghost sm" id="gh_del">Schlüssel entfernen</button>
      <button class="btn ghost sm" id="gh_test">Verbindung prüfen</button>
      <button class="btn ghost sm" id="gh_push">Jetzt senden</button>

/* ---- Einteilung erzeugen und einzeln anpassen ---- */
function runDuty() {
  const refs = (st.refs || []).filter(p => p.n);
  if (!refs.length) { flash('Zuerst Personen erfassen'); return; }
  const s = schedule(st), ko = finalRound(st, s);
  st.duty = assignDuty(st, s, ko);
  const stats = dutyStats(st, s, ko);
  save(true);
  flash(stats.open ? `Einteilung erzeugt – ${stats.open} Posten offen` : 'Einteilung erzeugt');
}

function dutySheet(key) {
  const s = schedule(st), ko = finalRound(st, s);
  const games = dutyMatches(st, s, ko);
  const m = games.find(x => x.key === key);
  if (!m) return;
  const cur = (st.duty[key] || [null, null, null]).slice(0, 3);
  const teamOf = p => { if (!p.tm) return null; const x = p.tm.split('-').map(Number); return (st.names[x[0]] || [])[x[1]] || null; };
  const spielt = (p) => {
    const nm = teamOf(p);
    if (!nm) return false;
    return s.matches.some(q => (q.nameA === nm || q.nameB === nm) && q.from < m.to && m.from < q.to);
  };
  const anderswo = (p) => games.some(g => g.key !== key && g.from < m.to && m.from < g.to &&
    (st.duty[g.key] || []).includes(p.id));
  const vorb = p => prepBlocks(st, s, ko, p).has(m.from);
  const ok = (p, slot) => canRole(p, slot) && p.f <= m.from && p.t >= m.to &&
    !spielt(p) && !anderswo(p) && !vorb(p) && teamOf(p) !== m.a && teamOf(p) !== m.b;

  const sel = r => `<select data-du="${r}"><option value="">— offen —</option>${
    (st.refs || []).filter(p => p.n && (ok(p, r) || cur[r] === p.id))
      .map(p => `<option value="${p.id}"${cur[r] === p.id ? ' selected' : ''}>${esc(p.n)}${ok(p, r) ? '' : ' (Konflikt)'}</option>`).join('')
  }</select>`;
  const host = document.createElement('div');
  host.innerHTML = `<div class="back" id="back"><div class="sheet" role="dialog" aria-modal="true" aria-label="Einteilung">
    <h3>Einteilung</h3>
    <div class="src">${esc(m.label)} · ${hhmm(m.from)}–${hhmm(m.to)} · Feld ${m.court}</div>
    <div class="mono muted" style="font-size:12px;margin-bottom:12px">${esc(m.a)} gegen ${esc(m.b)}</div>
    ${DUTY_ROLES.map((r, i) => `<div class="fld" style="margin-bottom:9px"><label>${r}</label>${sel(i)}</div>`).join('')}
    <p class="muted"><small>Aufgeführt sind nur Personen mit passender Rolle, die in diesem Zeitfenster frei sind und nicht selbst spielen.</small></p>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="duOk">Übernehmen</button>
      <button class="btn ghost" id="duCancel">Abbrechen</button>
    </div>
  </div></div>`;
  document.body.appendChild(host.firstElementChild);
  const el = $('#back');
  openSheet = { duty: true };
  const close = () => { el.remove(); openSheet = null; document.removeEventListener('keydown', escDu); };
  const escDu = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', escDu);
  el.addEventListener('click', e => { if (e.target === el) close(); });
  $('#duCancel').onclick = close;
  $('#duOk').onclick = () => {
    const v = [0, 1, 2].map(i => el.querySelector(`[data-du="${i}"]`).value || null);
    const gesetzt = v.filter(Boolean);
    if (new Set(gesetzt).size !== gesetzt.length) { flash('Eine Person kann nicht zwei Posten übernehmen'); return; }
    st.duty[key] = v;
    close(); save(true);
  };
}

/* ---- Gemeinsamer Bauplan für PDF und Excel ----
   Masse und Farben stammen aus der Vorlage «Spielplan_Beachvolleyballturnier_2026.pdf». */
const AUS = {
  blau: [0.302, 0.576, 0.851],      // #4D93D9 Kopfzeile
  zebra: [0.855, 0.914, 0.973],     // #DAE9F8
  rosa: [0.949, 0.808, 0.937],      // #F2CEEF Endrunde
  linie: [0, 0, 0],
  hexBlau: 'FF4D93D9', hexZebra: 'FFDAE9F8', hexRosa: 'FFF2CEEF',
};

function tagesteil(s, g) {
  const m = s.matches.filter(x => x.g === g);
  if (!m.length) return '';
  const von = Math.min(...m.map(x => x.from)), bis = Math.max(...m.map(x => x.to));
  if (st.sizes.length < 2 || st.mode !== 'block') return '';
  if (bis <= 12 * 60 + 30) return ' - Vormittag';
  if (von >= 11 * 60 + 30) return ' - Nachmittag';
  return '';
}

function planLayout() {
  const s = schedule(st), fr = finalRound(st, s);
  const items = planItems(s, fr);
  const hasRefs = (st.refs || []).filter(p => p.n).length > 0;

  let nr = 0;
  const zeilen = items.map(it => {
    if (it.t === 'p') return { pause: true, text: it.phase + ' · ' + hhmm(it.from) + ' – ' + hhmm(it.to) };
    nr++;
    const du = (st.duty || {})[it.key] || [];
    return {
      nr, von: hhmm(it.from), bis: hhmm(it.to), gruppe: it.phase,
      t1: it.a, t2: it.b, stage: it.stage,
      refs: hasRefs ? [0, 1, 2].map(r => refName(du[r]) || '–') : null,
    };
  });

  const marke = z => {
    if (z.pause) return { k: 'pause', label: null, ko: false };
    if (z.stage[0] === 'g') {
      return st.mode === 'block'
        ? { k: z.stage, label: null, ko: false }
        : { k: 'gruppen', label: null, ko: false };
    }
    if (z.stage === 'qf') return { k: 'qf', label: 'Viertelfinale', ko: true };
    if (z.stage === 'hf') return { k: 'hf', label: 'Halbfinale', ko: true };
    return { k: 'fin', label: 'Finale', ko: true };
  };
  const bloecke = [];
  let akt = null;
  zeilen.forEach(z => {
    const m = marke(z);
    if (!akt || akt.k !== m.k) { akt = { k: m.k, label: m.label, ko: m.ko, zeilen: [] }; bloecke.push(akt); }
    akt.zeilen.push(z);
  });

  const gruppen = st.sizes.map((n, g) => ({
    titel: 'Gruppe ' + GL(g) + tagesteil(s, g),
    teams: st.names[g].slice(),
  }));

  const spalten = hasRefs
    ? [['von', 38, 'c'], ['bis', 38, 'c'], ['Spiel', 24, 'c'], ['Gruppe', 72, 'l'],
       ['Team 1', 82, 'c'], ['Team 2', 82, 'c'],
       ['Schiri', 53, 'c'], ['Täfeler 1', 51, 'c'], ['Täfeler 2', 49.9, 'c']]
    : [['von', 51, 'c'], ['bis', 50, 'c'], ['Spiel', 50, 'c'], ['Gruppe', 85.5, 'l'],
       ['Team 1', 124, 'c'], ['Team 2', 129.4, 'c']];

  return {
    s, fr, hasRefs, bloecke, gruppen, spalten,
    titel: (st.title || 'Turnier'), untertitel: 'Spielplan',
    werte: z => [z.von, z.bis, String(z.nr), z.gruppe, z.t1, z.t2].concat(z.refs || []),
  };
}

/* ---- PDF im Layout der Vorlage ---- */
function exportPdf() {
  const P = planLayout();
  const d = pdfDoc({ landscape: false });     // Hochformat wie in der Vorlage
  d.setzeBild(LOGO);
  const L = 50.6;
  const BR = d.W - 2 * L;
  const skala = BR / P.spalten.reduce((a, c) => a + c[1], 0);
  const bx = i => P.spalten[i][1] * skala;
  const xs = []; let px = L;
  P.spalten.forEach(c => { xs.push(px); px += c[1] * skala; });

  const ZH = 12.25, KH = 12.5, FS = P.hasRefs ? 7.2 : 8;
  const yT = v => d.H - v;                       // Punkte von oben in PDF-Koordinaten
  let top = 0, blockAb = 0;

  const zelle = (i, y, txt, fett) => {
    const t = pdfFit(txt, FS, fett, bx(i) - 6);
    if (P.spalten[i][2] === 'c') d.textC(xs[i] + bx(i) / 2, y, t, FS, fett);
    else d.text(xs[i] + 3, y, t, FS, fett);
  };
  const kopfzeile = () => {
    d.farbe.apply(d, AUS.blau);
    d.rechteck(L, yT(top + KH), BR, KH);
    d.farbe(1, 1, 1);
    P.spalten.forEach((c, i) => zelle(i, yT(top + KH) + 3.6, c[0], true));
    top += KH;
  };
  const rahmen = () => {
    d.strich.apply(d, AUS.linie);
    const h = top - blockAb;
    d.raw(`0.8 w ${L.toFixed(2)} ${yT(top).toFixed(2)} ${BR.toFixed(2)} ${h.toFixed(2)} re S`);
  };

  const seitenkopf = (erste) => {
    d.farbe(0, 0, 0);
    if (erste) {
      d.zeichneBild(L + 45, yT(64), LOGO.w * 46 / LOGO.h, 46);
      d.textC(d.W / 2, yT(34), P.titel, 16, true);
      d.textC(d.W / 2, yT(53), P.untertitel, 16, true);
      // Gruppenkästen
      const kb = Math.min(160, (BR - 60) / Math.max(2, P.gruppen.length));
      const abst = P.gruppen.length > 1 ? Math.min(64, (BR - P.gruppen.length * kb) / (P.gruppen.length - 1)) : 0;
      const gesamt = P.gruppen.length * kb + (P.gruppen.length - 1) * abst;
      let kx = (d.W - gesamt) / 2;
      P.gruppen.forEach(gr => {
        let ky = 92;
        d.strich.apply(d, AUS.linie);
        d.farbe(0, 0, 0);
        d.text(kx + 2, yT(ky + ZH) + 3.4, pdfFit(gr.titel, FS, true, kb - 6), FS, true);
        d.raw(`0.8 w ${kx.toFixed(2)} ${yT(ky + ZH).toFixed(2)} ${kb.toFixed(2)} ${ZH.toFixed(2)} re S`);
        ky += ZH;
        gr.teams.forEach(t => {
          d.text(kx + 2, yT(ky + ZH) + 3.4, pdfFit(t, FS, false, kb - 6), FS, false);
          d.raw(`0.8 w ${kx.toFixed(2)} ${yT(ky + ZH).toFixed(2)} ${kb.toFixed(2)} ${ZH.toFixed(2)} re S`);
          ky += ZH;
        });
        kx += kb + abst;
      });
      top = 92 + ZH * (1 + Math.max.apply(null, P.gruppen.map(g => g.teams.length))) + 22;
    } else {
      top = 40;
    }
  };

  seitenkopf(true);
  let ersteTabelle = true;

  P.bloecke.forEach(bl => {
    const noetig = (bl.label ? 16 : 0) + (ersteTabelle ? KH : 0) + bl.zeilen.length * ZH + 6;
    if (top + noetig > d.H - 34) { d.neu(); seitenkopf(false); ersteTabelle = true; }
    if (bl.label) {
      d.farbe(0, 0, 0);
      d.textC(d.W / 2, yT(top + 11), bl.label, 10, true);
      top += 16;
    }
    blockAb = top;
    if (ersteTabelle) { kopfzeile(); ersteTabelle = false; }
    bl.zeilen.forEach(z => {
      if (z.pause) {
        d.farbe.apply(d, AUS.zebra);
        d.rechteck(L, yT(top + ZH), BR, ZH);
        d.farbe(0.2, 0.2, 0.2);
        d.textC(d.W / 2, yT(top + ZH) + 3.4, z.text, FS, true);
        top += ZH; return;
      }
      if (bl.ko) { d.farbe.apply(d, AUS.rosa); d.rechteck(L, yT(top + ZH), BR, ZH); }
      else if (z.nr % 2 === 0) { d.farbe.apply(d, AUS.zebra); d.rechteck(L, yT(top + ZH), BR, ZH); }
      d.farbe(0, 0, 0);
      P.werte(z).forEach((v, i) => zelle(i, yT(top + ZH) + 3.4, v, false));
      top += ZH;
    });
    rahmen();
    top += 11;
  });

  const bl = pdfBuild(d, { title: P.titel + ' – Spielplan' });
  const blob = new Blob([bl], { type: PDF_MIME });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = xlsxFileName().replace(/\.xlsx$/, '.pdf');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  flash('PDF erstellt');
}

/* ---- Excel im selben Layout ---- */
function exportXlsx() {
  const P = planLayout();
  const N = P.spalten.length;
  const rows = [], merges = [];
  const LC = colName(N - 1);
  const leer = st0 => Array(N).fill({ v: '', s: st0 });

  rows.push([{ v: P.titel, s: 10 }]); merges.push('A1:' + LC + '1');
  rows.push([{ v: P.untertitel, s: 10 }]); merges.push('A2:' + LC + '2');
  rows.push([]);

  // Gruppenkästen nebeneinander
  const maxT = Math.max.apply(null, P.gruppen.map(g => g.teams.length));
  const kopfZ = rows.length + 1;
  const kzeile = [];
  P.gruppen.forEach((g, i) => { kzeile[i * 2] = { v: g.titel, s: 11 }; kzeile[i * 2 + 1] = { v: '', s: 0 }; });
  rows.push(kzeile);
  for (let r = 0; r < maxT; r++) {
    const z = [];
    P.gruppen.forEach((g, i) => { z[i * 2] = { v: g.teams[r] || '', s: g.teams[r] ? 12 : 0 }; z[i * 2 + 1] = { v: '', s: 0 }; });
    rows.push(z);
  }
  rows.push([]);

  let ersteTabelle = true;
  P.bloecke.forEach(bl => {
    if (bl.label) {
      rows.push(P.spalten.map((c, i) => ({ v: i === 0 ? bl.label : '', s: 13 })));
      merges.push('A' + rows.length + ':' + LC + rows.length);
    }
    if (ersteTabelle) { rows.push(P.spalten.map(c => ({ v: c[0], s: 14 }))); ersteTabelle = false; }
    bl.zeilen.forEach(z => {
      if (z.pause) {
        rows.push([{ v: z.text, s: 16 }].concat(Array(N - 1).fill({ v: '', s: 16 })));
        merges.push('A' + rows.length + ':' + LC + rows.length);
        return;
      }
      const stil = bl.ko ? 17 : (z.nr % 2 === 0 ? 16 : 15);
      rows.push(P.werte(z).map((v, i) => ({ v, s: stil })));
    });
    rows.push([]);
  });

  const kopfZeile = rows.findIndex(r => r.length && r[0] && r[0].s === 14) + 1;
  const sheets = [{
    name: 'Spielplan', rows,
    titles: kopfZeile ? `${kopfZeile}:${kopfZeile}` : null,
    opt: {
      cols: P.spalten.map(c => Math.round(c[1] / 5.2)),
      merges, landscape: false,
    },
  }];

  if (P.hasRefs) {
    const stats = dutyStats(st, P.s, P.fr);
    const T = m => ({ v: (m / 1440).toFixed(10), t: 'z', s: 4 });
    const g3 = [[{ v: 'Schiedsrichter und Täfeler', s: 10 }], [],
      ['Person', 'Rolle', 'von', 'bis', 'Einsätze', 'Schiedsrichter', 'Täfeler 1', 'Täfeler 2', 'spielt in']
        .map(h => ({ v: h, s: 14 }))];
    stats.rows.forEach(r => g3.push([
      { v: r.n, s: 15 }, { v: ROLE_SHORT[r.r], s: 15 }, T(r.f), T(r.t), { v: r.cnt, t: 'n', s: 15 },
      { v: r.byRole[0], t: 'n', s: 15 }, { v: r.byRole[1], t: 'n', s: 15 }, { v: r.byRole[2], t: 'n', s: 15 },
      { v: r.tm ? teamLabel(r.tm) : '', s: 15 },
    ]));
    if (stats.open) g3.push([], [{ v: stats.open + ' von ' + stats.total + ' Posten unbesetzt', s: 11 }]);
    sheets.push({ name: 'Einsätze', rows: g3, opt: { cols: [24, 20, 8, 8, 10, 14, 12, 12, 28] } });
  }

  const buf = buildXlsx(sheets);
  const blob = new Blob([buf], { type: XLSX_MIME });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = xlsxFileName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  flash('Excel-Datei erstellt');
}

/* ================= Dialog zur Resultaterfassung ================= */
function sheetFor(kind, key, idx) {
  const s = schedule(st), fr = finalRound(st, s);
  let title, srcTxt, nameA, nameB, sets, nSets;
  if (kind === 'g') {
    const m = (s.byGroup[key] || []).find(x => x.idx === idx);
    if (!m) return;
    title = `Gruppe ${GL(key)} · Runde ${m.round + 1}`;
    srcTxt = `${hhmm(m.from)}–${hhmm(m.to)} · Feld ${m.court}`;
    nameA = m.nameA; nameB = m.nameB; nSets = 1;
    sets = [m.res ? m.res.slice() : [null, null]];
  } else {
    const g = fr.games.find(x => x.id === idx);
    if (!g) return;
    title = g.label;
    srcTxt = `${hhmm(g.from)}–${hhmm(g.to)} · Feld ${g.court} · ${g.srcA} / ${g.srcB}`;
    nameA = g.nameA; nameB = g.nameB; nSets = g.nSets;
    sets = st.rF[idx].slice(0, nSets).map(x => x ? x.slice() : [null, null]);
  }
  openSheet = { kind, key, idx, sets, nSets };

  const stepper = (si, side, val) => `<div class="stp">
      <button type="button" data-step="${si},${side},-1" aria-label="weniger">−</button>
      <input type="text" inputmode="numeric" pattern="[0-9]*" data-in="${si},${side}" value="${val === null ? '' : val}" aria-label="Punkte">
      <button type="button" data-step="${si},${side},1" aria-label="mehr">+</button>
    </div>`;

  const body = `<div class="back" id="back"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h3>${esc(title)}</h3><div class="src">${esc(srcTxt)}</div>
    <div class="names"><div>·</div><div>${esc(nameA)}</div><div>${esc(nameB)}</div></div>
    ${sets.map((sv, i) => `<div class="setrow"><div class="n">${nSets === 1 ? 'Satz' : 'S' + (i + 1)}</div>
        ${stepper(i, 0, sv[0])}${stepper(i, 1, sv[1])}</div>`).join('')}
    ${nSets === 3 ? '<p class="muted"><small>Satz 3 nur bei Satzgleichstand 1:1 ausfüllen.</small></p>' : ''}
    ${nSets === 2 ? '<p class="muted"><small>Bei 1:1 Sätzen entscheidet die Gesamtpunktzahl.</small></p>' : ''}
    <div class="row" style="margin-top:14px">
      <button class="btn" id="okBtn">Speichern</button>
      <button class="btn ghost" id="cancelBtn">Abbrechen</button>
      <button class="btn ghost" id="clrBtn" style="margin-left:auto">Leeren</button>
    </div>
  </div></div>`;
  const host = document.createElement('div');
  host.innerHTML = body;
  document.body.appendChild(host.firstElementChild);
  const el = $('#back');
  el.querySelector('input').focus();

  el.addEventListener('click', e => { if (e.target === el) closeSheet(); });
  el.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
    const [si, side, d] = b.dataset.step.split(',').map(Number);
    const inp = el.querySelector(`[data-in="${si},${side}"]`);
    const cur = inp.value === '' ? 0 : parseInt(inp.value, 10) || 0;
    inp.value = Math.max(0, Math.min(99, cur + d));
  }));
  $('#cancelBtn').onclick = closeSheet;
  $('#clrBtn').onclick = () => { el.querySelectorAll('[data-in]').forEach(i => i.value = ''); };
  $('#okBtn').onclick = () => {
    const vals = [];
    for (let i = 0; i < nSets; i++) {
      const a = el.querySelector(`[data-in="${i},0"]`).value.trim();
      const b = el.querySelector(`[data-in="${i},1"]`).value.trim();
      vals.push((a === '' || b === '') ? null : [Math.max(0, parseInt(a, 10) || 0), Math.max(0, parseInt(b, 10) || 0)]);
    }
    if (kind === 'g') {
      st.res[key][idx] = vals[0];
    } else {
      const cur = st.rF[idx];
      for (let i = 0; i < nSets; i++) cur[i] = vals[i];
      if (nSets === 2) cur[2] = null;
    }
    closeSheet(); save(true);
  };
  document.addEventListener('keydown', escClose);
}
function escClose(e) { if (e.key === 'Escape') closeSheet(); }
function closeSheet() {
  const el = $('#back'); if (el) el.remove();
  openSheet = null;
  document.removeEventListener('keydown', escClose);
}

function askPassword() {
  const host = document.createElement('div');
  host.innerHTML = `<div class="back" id="back"><div class="sheet" role="dialog" aria-modal="true"
      aria-label="Bearbeiten freischalten">
    <h3>Bearbeiten freischalten</h3>
    <div class="src">Passwort der Turnierleitung</div>
    <div class="pwrow"><input id="pwIn" type="password" autocomplete="current-password"
      aria-label="Passwort" placeholder="Passwort"></div>
    <label class="check"><input type="checkbox" id="pwRem" checked> Auf diesem Gerät merken</label>
    <p id="pwMsg" class="pwmsg" role="alert"></p>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="pwOk">Freischalten</button>
      <button class="btn ghost" id="pwCancel">Abbrechen</button>
    </div>
    <p class="muted" style="margin-top:10px"><small>Der Schutz verhindert versehentliches Umschalten.
      Er ist kein Zugriffsschutz – die Seite läuft vollständig im Browser.</small></p>
  </div></div>`;
  document.body.appendChild(host.firstElementChild);
  const el = $('#back');
  openSheet = { pw: true };
  const inp = $('#pwIn');
  inp.focus();
  const close = () => { el.remove(); openSheet = null; document.removeEventListener('keydown', escPw); };
  const escPw = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', escPw);
  el.addEventListener('click', e => { if (e.target === el) close(); });
  $('#pwCancel').onclick = close;
  const submit = () => {
    const btn = $('#pwOk');
    btn.textContent = 'Prüfe …';
    setTimeout(() => {
      const ok = derivePw(inp.value, st.pwSalt) === st.pwHash;
      if (!ok) {
        btn.textContent = 'Freischalten';
        $('#pwMsg').textContent = 'Passwort stimmt nicht.';
        inp.select();
        return;
      }
      setUnlocked(true, $('#pwRem').checked);
      close(); RO = false; render();
    }, 30);
  };
  $('#pwOk').onclick = submit;
  inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
}

/* ================= Rendern ================= */
function tabList() {
  const t = [['jetzt', 'Jetzt'], ['plan', 'Zeitplan']];
  st.sizes.forEach((_, g) => t.push(['g' + g, 'Gruppe ' + GL(g)]));
  t.push(['final', 'Finalrunde'], ['rang', 'Rangliste'], ['setup', 'Einstellungen'], ['teilen', 'Teilen']);
  return t;
}

function busy() {
  if (openSheet) return true;
  const a = document.activeElement;
  return !!(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
}

function render() {
  const focusId = (document.activeElement || {}).id;
  const s = schedule(st), fr = finalRound(st, s);
  $('#clb').textContent = st.club || '';
  $('#ttl').textContent = st.title || 'Beachvolleyball-Turnier';
  $('#dte').textContent = st.date || '';
  let syncTxt = SNAP ? 'Snapshot' : { shared: 'Live geteilt', local: 'Dieses Gerät', memory: 'Nur Sitzung' }[Store.mode];
  let syncCls = (Store.mode === 'memory' && !SNAP) ? ' warn' : '';
  if (ghReady() && ghInfo.ok === false) { syncTxt = 'GitHub gestört'; syncCls = ' warn'; }
  else if (ghReady() && ghHas) { syncTxt = 'Live GitHub'; syncCls = ' live'; }
  $('#syncChip').textContent = syncTxt;
  $('#syncChip').className = 'chip' + syncCls;
  $('#syncChip').title = ghReady() ? ghInfo.msg : '';
  $('#modeChip').innerHTML = RO
    ? '<button type="button" id="toEdit" title="Auf Bearbeiten umschalten">Nur lesen '
      + (st.pwHash ? '&#128274;' : '⇄') + '</button>'
    : '<button type="button" id="toRead" title="Auf Nur lesen umschalten">Bearbeiten ⇄</button>';
  $('#modeChip').className = 'chip' + (RO ? '' : ' edit');

  const tabs = tabList().filter(t => !RO || (t[0] !== 'setup' && t[0] !== 'teilen'));
  if (!tabs.some(t => t[0] === view)) view = 'jetzt';
  $('#nav').innerHTML = tabs.map(([k, l]) =>
    `<button type="button" data-tab="${k}" aria-current="${view === k}">${l}</button>`).join('');

  let html;
  if (view === 'jetzt') html = viewJetzt(s, fr);
  else if (view === 'plan') html = viewPlan(s, fr);
  else if (/^g\d+$/.test(view)) html = viewGroup(s, fr, parseInt(view.slice(1), 10));
  else if (view === 'final') html = viewFinal(s, fr);
  else if (view === 'rang') html = viewRang(s, fr);
  else if (view === 'setup') html = viewSetup();
  else html = viewTeilen(s);
  $('#main').innerHTML = html;

  $('#nav').querySelectorAll('[data-tab]').forEach(b =>
    b.onclick = () => { view = b.dataset.tab; render(); window.scrollTo(0, 0); });
  const te = $('#toEdit'), tr = $('#toRead');
  if (te) te.onclick = () => {
    if (st.pwHash && !isUnlocked()) { askPassword(); return; }
    RO = false; render();
  };
  if (tr) tr.onclick = () => { setUnlocked(false); RO = true; render(); };

  $('#main').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const v = b.dataset.edit;
    if (v[0] === 'g') {
      const [gi, mi] = v.slice(1).split('-').map(Number);
      sheetFor('g', gi, mi);
    } else sheetFor('f', null, parseInt(v.slice(1), 10));
  });
  $('#main').querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); flash('Link kopiert'); }
    catch (e) { flash('Kopieren nicht möglich – Link manuell markieren'); }
  });
  const bx = $('#btnXlsx');
  if (bx) bx.onclick = () => { try { exportXlsx(); } catch (e) { flash('Export fehlgeschlagen: ' + e.message); } };
  const bpdf = $('#btnPdf');
  if (bpdf) bpdf.onclick = () => { try { exportPdf(); } catch (e) { flash('PDF fehlgeschlagen: ' + e.message); } };
  const bp = $('#btnPrint');
  if (bp) bp.onclick = () => window.print();
  const bd = $('#btnDuty');
  if (bd) bd.onclick = () => runDuty();
  $('#main').querySelectorAll('[data-duty]').forEach(b => b.onclick = () => dutySheet(b.dataset.duty));
  if (view === 'setup') wireSetup();
  if (view === 'teilen') {
    const bi = $('#s_base');
    if (bi) bi.onchange = () => { st.base = clean(bi.value); save(); };
  }
  syncNavTop();
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus(); }
}

function syncNavTop() {
  const t = $('.top');
  if (t) document.documentElement.style.setProperty('--navtop', t.offsetHeight + 'px');
}

function wireSetup() {
  const num = (id, k, min) => {
    const el = document.getElementById(id); if (!el) return;
    el.onchange = () => {
      let v = parseInt(el.value, 10);
      if (isNaN(v)) v = DEFAULTS[k];
      if (min !== undefined) v = Math.max(min, v);
      st[k] = v; save();
    };
  };
  const txt = (id, k) => {
    const el = document.getElementById(id); if (!el) return;
    el.onchange = () => { st[k] = clean(el.value); el.value = st[k]; save(); };
  };
  txt('s_club', 'club'); txt('s_title', 'title'); txt('s_date', 'date');
  const sEl = $('#s_start');
  if (sEl) sEl.onchange = () => {
    const v = parseHHMM(sEl.value);
    if (v === null) { flash('Startzeit bitte als hh:mm, z. B. 09:00'); sEl.value = hhmm(st.start); return; }
    st.start = v; save();
  };
  num('s_dGroup', 'dGroup', 1); num('s_pGroup', 'pGroup', 0); num('s_lunch', 'lunch', 0);
  num('s_dQuarter', 'dQuarter', 1); num('s_dSemi', 'dSemi', 1); num('s_dFinal', 'dFinal', 1); num('s_pFinal', 'pFinal', 0);
  num('s_win', 'win'); num('s_draw', 'draw'); num('s_loss', 'loss');

  const c = $('#s_courts');
  if (c) c.onchange = () => { st.courts = parseInt(c.value, 10); save(); };
  [['s_qf', 'qf'], ['s_hf', 'hf'], ['s_kf', 'kf']].forEach(([id, key]) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.onchange = () => {
      st[key] = el.checked;
      if (key === 'hf' && !el.checked) { st.qf = false; st.kf = false; }
      normalize(st); save();
    };
  });
  const pa = $('#s_pauseAfter');
  if (pa) pa.onchange = () => { st.pauseAfter = pa.value; normalize(st); save(); };
  const md = $('#s_mode');
  if (md) md.onchange = () => { st.mode = md.value === 'mixed' ? 'mixed' : 'block'; save(); };
  const gr = $('#s_groups');
  if (gr) gr.onchange = () => {
    const want = clamp(parseInt(gr.value, 10) || 1, 1, MAXG), have = st.sizes.length;
    if (want < have) {
      const lost = st.res.slice(want).some(a => a.some(r => r));
      if (lost && !confirm('Die hinteren Gruppen enthalten bereits Resultate. Wirklich entfernen?')) {
        gr.value = have; return;
      }
      st.sizes = st.sizes.slice(0, want);
    } else {
      while (st.sizes.length < want) st.sizes.push(4);
    }
    normalize(st); save();
  };
  document.querySelectorAll('[data-size]').forEach(inp => inp.onchange = () => {
    const g = parseInt(inp.dataset.size, 10);
    const v = clamp(parseInt(inp.value, 10) || MINSZ, MINSZ, MAXSZ);
    if (v < st.sizes[g]) {
      const keep = v * (v - 1) / 2;
      if (st.res[g].slice(keep).some(r => r) &&
          !confirm('Beim Verkleinern gehen bereits erfasste Resultate dieser Gruppe verloren. Fortfahren?')) {
        inp.value = st.sizes[g]; return;
      }
    }
    st.sizes[g] = v; normalize(st); save();
  });
  document.querySelectorAll('[data-team]').forEach(inp => inp.onchange = () => {
    const [g, i] = inp.dataset.team.split('-').map(Number);
    const v = clean(inp.value) || `Team ${GL(g)}${i + 1}`;
    inp.value = v; st.names[g][i] = v; save();
  });
  document.querySelectorAll('[data-ref]').forEach(el => el.onchange = () => {
    const [i, k] = el.dataset.ref.split('-');
    const p = st.refs[+i]; if (!p) return;
    if (k === 'n') p.n = clean(el.value);
    else if (k === 'tm') p.tm = el.value;
    else if (k === 'r') p.r = el.value;
    else {
      const v = parseHHMM(el.value);
      if (v === null) { flash('Zeit bitte als hh:mm, z. B. 09:00'); el.value = hhmm(p[k]); return; }
      p[k] = v;
    }
    normalize(st); save();
  });
  document.querySelectorAll('[data-refdel]').forEach(el => el.onclick = () => {
    const i = +el.dataset.refdel;
    const p = st.refs[i];
    const drin = Object.values(st.duty || {}).some(d => (d || []).includes(p && p.id));
    if (drin && !confirm('Diese Person ist bereits eingeteilt. Wirklich entfernen? Die betroffenen Posten werden frei.')) return;
    st.refs.splice(i, 1); normalize(st); save();
  });
  const addRef = (n) => {
    const s0 = schedule(st);
    for (let k = 0; k < n; k++) st.refs.push({ n: '', f: s0.groupStart, t: s0.end, tm: '' });
    normalize(st); save();
  };
  const pr = $('#s_prep');
  if (pr) pr.onclick = null;
  if (pr) pr.onchange = () => { st.prepSlots = parseInt(pr.value, 10) || 0; normalize(st); save(); };
  const rA = $('#refAdd'); if (rA) rA.onclick = () => addRef(1);
  const rB = $('#refAdd5'); if (rB) rB.onclick = () => addRef(5);
  const dG = $('#dutyGen'); if (dG) dG.onclick = () => runDuty();
  const dC = $('#dutyClear');
  if (dC) dC.onclick = () => {
    if (!confirm('Die gesamte Einteilung löschen?')) return;
    st.duty = {}; save(); flash('Einteilung gelöscht');
  };

  const ghField = (id, key) => {
    const el = document.getElementById(id); if (!el) return;
    el.onchange = () => {
      st.gh[key] = el.value.trim();
      normalize(st); el.value = st.gh[key]; save();
      if (ghReady()) ghPull().then(ch => { if (ch) render(); else render(); });
    };
  };
  ghField('gh_owner', 'owner'); ghField('gh_repo', 'repo');
  ghField('gh_branch', 'branch'); ghField('gh_path', 'path');
  const gOn = $('#gh_on');
  if (gOn) gOn.onchange = () => {
    st.gh.on = gOn.checked; save();
    if (st.gh.on) { ghSay(null, 'eingeschaltet'); ghPull().then(() => render()); }
    else ghSay(null, 'ausgeschaltet');
  };
  const gS = $('#gh_save');
  if (gS) gS.onclick = () => {
    const v = $('#gh_tok').value.trim();
    if (!v) { flash('Bitte den Schlüssel einfügen'); return; }
    ghSetToken(v); $('#gh_tok').value = '';
    flash('Schlüssel gespeichert'); ghSay(null, 'Schlüssel hinterlegt'); render();
  };
  const gD = $('#gh_del');
  if (gD) gD.onclick = () => { ghSetToken(''); flash('Schlüssel entfernt'); render(); };
  const gT = $('#gh_test');
  if (gT) gT.onclick = async () => {
    gT.textContent = 'Prüfe …';
    await ghPull();
    gT.textContent = 'Verbindung prüfen';
    render();
  };
  const gP = $('#gh_push');
  if (gP) gP.onclick = async () => { gP.textContent = 'Sende …'; await ghPushNow(true); gP.textContent = 'Jetzt senden'; render(); };

  const setPw = (val) => {
    const salt = newSalt();
    st.pwSalt = salt; st.pwHash = derivePw(val, salt);
    setUnlocked(true, true); save(true);
  };
  const on = $('#btnPwOn');
  if (on) on.onclick = () => {
    const a = $('#pwNew').value, b = $('#pwNew2').value;
    if (a.length < 4) { flash('Bitte mindestens vier Zeichen'); return; }
    if (a !== b) { flash('Die beiden Eingaben stimmen nicht überein'); return; }
    on.textContent = 'Setze …';
    setTimeout(() => { setPw(a); flash('Passwort gesetzt'); }, 30);
  };
  const ch = $('#btnPwChange');
  if (ch) ch.onclick = () => {
    const v = prompt('Neues Passwort (mindestens vier Zeichen):');
    if (v === null) return;
    if (v.length < 4) { flash('Bitte mindestens vier Zeichen'); return; }
    setPw(v); flash('Passwort geändert');
  };
  const off = $('#btnPwOff');
  if (off) off.onclick = () => {
    if (!confirm('Schutz wirklich entfernen? Danach kann jeder in den Bearbeitungsmodus wechseln.')) return;
    setUnlocked(false); st.pwSalt = ''; st.pwHash = ''; save(true); flash('Schutz entfernt');
  };
  const ex = $('#btnExport');
  if (ex) ex.onclick = () => {
    const copy = Object.assign({}, st);
    delete copy.pwSalt; delete copy.pwHash;   // Sicherung sperrt niemanden aus
    const blob = new Blob([JSON.stringify(copy, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'turnier-sicherung.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const im = $('#btnImport'), fi = $('#fileImp');
  if (im) im.onclick = () => fi.click();
  if (fi) fi.onchange = () => {
    const f = fi.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { st = merge(JSON.parse(r.result)); save(true); flash('Sicherung eingelesen'); }
      catch (e) { flash('Datei konnte nicht gelesen werden'); }
    };
    r.readAsText(f);
  };
  const cl = $('#btnClearRes');
  if (cl) cl.onclick = () => {
    if (!confirm('Wirklich alle erfassten Resultate löschen? Teams und Einstellungen bleiben.')) return;
    st.res = st.sizes.map(n => Array(n * (n - 1) / 2).fill(null));
    st.rF = Array.from({ length: 8 }, () => [null, null, null]);
    save(true); flash('Resultate gelöscht');
  };
}

/* ================= Start ================= */
async function boot() {
  const hash = location.hash || '';
  if (hash.startsWith('#d=')) {
    try { st = decodeState(hash.slice(3)); SNAP = true; RO = true; }
    catch (e) { flash('Snapshot-Link konnte nicht gelesen werden'); }
  }
  if (!SNAP) {
    Store.detect();
    const raw = await Store.get();
    if (raw) st = merge(raw);
    if (hash === '#v') RO = true;
  }
  // Mit gesetztem Passwort startet die Seite gesperrt, bis freigeschaltet wird
  if (st.pwHash && !isUnlocked()) RO = true;
  // Repository aus der Adresse ableiten, solange nichts eingetragen ist
  if (!SNAP && !st.gh.owner && !st.gh.repo) {
    const a = ghAuto();
    if (a) { st.gh.owner = a.owner; st.gh.repo = a.repo; st.gh.on = true; }
  }
  render();
  if (ghReady()) { ghPull().then(() => render()); }
  setInterval(async () => {
    if (busy() || !ghReady()) return;
    const ch = await ghPull();
    render();
    if (ch) return;
  }, 20000);
  window.addEventListener('resize', syncNavTop);
  setInterval(() => { if (!busy()) render(); }, 30000);   // Uhrzeit / «läuft jetzt»
  // Zweites Fenster desselben Browsers nachziehen (z. B. QR-Anzeige auf dem Zweitschirm)
  if (!SNAP && Store.mode === 'local') {
    window.addEventListener('storage', e => {
      if (e.key !== KEY || busy()) return;
      try {
        const raw = JSON.parse(e.newValue || 'null');
        if (raw && (raw.ts || 0) > (st.ts || 0)) { st = merge(raw); render(); }
      } catch (err) { /* unlesbar, ignorieren */ }
    });
  }
  if (!SNAP && Store.mode === 'shared') {
    setInterval(async () => {
      if (busy()) return;
      const raw = await Store.get();
      if (raw && (raw.ts || 0) > (st.ts || 0)) { st = merge(raw); render(); }
    }, 6000);
  }
}
document.addEventListener('DOMContentLoaded', boot);

</script>
