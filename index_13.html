<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00A032">
<title>Beachvolleyball-Turnier · Spielplan</title>
<meta name="description" content="Spielplan, Resultate und Rangliste des Beachvolleyball-Turniers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,700;1,800&family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Direkt aus der Vereinsseite gemessen */
  --green:#00A032;        /* Kopf- und Fussbalken, Kachelbeschriftungen */
  --green-d:#00801F;      /* dunkler, fuer kleine weisse Schrift und Buttons */
  --green-dd:#00661A;
  --green-l:#26AE51;      /* helleres Grün der Seite */
  --green-pale:#E9F6EC;
  --olive:#9EC265;        /* aus dem Beachturnier-Plakat des Vereins */
  --cream:#FCF2D6;        /* ebenfalls aus dem Plakat */
  --sun:#F2A11B; --sun-d:#8A5A00;   /* Signalfarbe fuer «läuft jetzt» */

  --paper:#FFFFFF; --bg:#F1F1F2; --soft:#FAFAFB; --soft2:#EBECED;
  --ink:#1E2223; --ink-2:#474D4E; --muted:#666D6F; --line:#DADDDE;

  --sans:'Archivo','Segoe UI',Roboto,system-ui,sans-serif;
  --cond:'Archivo Narrow','Roboto Condensed','Arial Narrow',var(--sans);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --r:10px; --r-s:7px;
  --sh:0 1px 2px rgba(30,34,35,.06), 0 3px 12px rgba(30,34,35,.05);
  --sh-1:0 1px 2px rgba(30,34,35,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px;
  line-height:1.5; -webkit-text-size-adjust:100%; padding-bottom:44px;
}
h1,h2,h3{font-family:var(--cond); margin:0; font-weight:700; letter-spacing:-.004em}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--ink); outline-offset:2px}

/* ---------- Kopf: flaches Vereinsgrün wie auf der Website ---------- */
.top{
  position:sticky; top:0; z-index:40; color:#fff; background:var(--green);
  border-bottom:3px solid var(--green-d);
  padding:9px 14px 10px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.brand{flex:1 1 auto; min-width:0}
/* Wortmarke: schwere, schräggestellte Versalien wie im Vereinslogo */
.topline{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px}
.eyebrow{display:inline-flex; align-items:center; font-family:var(--sans); font-weight:800;
  font-style:italic; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:#fff;
  background:rgba(0,0,0,.2); padding:3px 9px 3px 8px; border-radius:4px}
.top h1{font-size:21px; line-height:1.1; color:#fff}
.top .sub{font-size:11px; color:#fff; font-family:var(--mono); background:rgba(0,0,0,.2);
  padding:3px 8px; border-radius:4px}
.top .sub:empty{display:none}
.chips{display:flex; gap:6px; flex:0 0 auto; align-items:center}
.chip{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
  padding:5px 9px; border-radius:99px; background:rgba(0,0,0,.24); color:#fff; white-space:nowrap;
}
.chip.edit{background:var(--sun); color:#3A2600; font-weight:600}
.chip.warn{background:#7A1B00}
.chip.live{background:rgba(0,0,0,.24); box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.chip button{all:unset; cursor:pointer}
.chip button:focus-visible{outline:2px solid #fff; outline-offset:2px}

/* ---------- Navigation ---------- */
nav{
  position:sticky; top:var(--navtop,62px); z-index:35; background:var(--paper);
  border-bottom:1px solid var(--line); display:flex; overflow-x:auto;
  scrollbar-width:none; padding:0 6px; box-shadow:var(--sh-1);
}
nav::-webkit-scrollbar{display:none}
nav button{
  all:unset; cursor:pointer; padding:13px 14px 10px; font-family:var(--cond);
  font-size:15px; font-weight:600; color:var(--muted); white-space:nowrap;
  border-bottom:3px solid transparent; min-height:44px; display:flex; align-items:center;
}
nav button:hover{color:var(--ink)}
nav button[aria-current="true"]{color:var(--green-dd); border-bottom-color:var(--green)}
nav button:focus-visible{outline:2px solid var(--ink); outline-offset:-4px}

main{max-width:1020px; margin:0 auto; padding:16px 12px 64px}
section{margin-bottom:24px}
.hd{display:flex; align-items:baseline; gap:10px; margin:0 2px 9px; flex-wrap:wrap}
.hd h2{font-size:20px}
.hd .note{font-size:11.5px; color:var(--muted); font-family:var(--mono)}

/* ---------- Tagesband ---------- */
.ribbon{background:var(--paper); border:1px solid var(--line); border-radius:var(--r);
  padding:13px 14px 11px; margin-bottom:16px; box-shadow:var(--sh)}
.ribbon .cap{display:flex; align-items:baseline; gap:9px; margin-bottom:9px}
.ribbon .cap h2{font-size:15px}
.ribbon .cap .prog{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted)}
.ribbon .bars{display:flex; height:30px; border-radius:var(--r-s); overflow:hidden;
  position:relative; background:var(--soft2)}
.ribbon .seg{position:relative; display:flex; align-items:center; justify-content:center;
  min-width:0; font-family:var(--cond); font-size:11.5px; font-weight:700; letter-spacing:.05em;
  text-transform:uppercase; color:#fff; overflow:hidden}
.ribbon .seg + .seg{border-left:2px solid var(--paper)}
.ribbon .seg.a{background:var(--green)}
.ribbon .seg.l{background:var(--soft2); color:var(--ink-2)}
.ribbon .seg.b{background:var(--green-dd)}
.ribbon .seg.f{background:var(--olive); color:#243109}
.ribbon .now{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); z-index:2}
.ribbon .now::after{content:''; position:absolute; top:-4px; left:-3px; width:8px; height:8px;
  background:var(--ink); border-radius:99px}
.ribbon .lbl{display:flex; justify-content:space-between; font-family:var(--mono);
  font-size:10.5px; color:var(--muted); margin-top:7px; gap:8px}
.ribbon .track{height:4px; border-radius:99px; background:var(--soft2); margin-top:10px; overflow:hidden}
.ribbon .track i{display:block; height:100%; background:var(--green); border-radius:99px}

/* ---------- Spielkarten ---------- */
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; box-shadow:var(--sh)}
.match{
  display:grid; grid-template-columns:56px 1fr auto; gap:12px; align-items:center;
  padding:11px 13px; border-top:1px solid var(--line); background:var(--paper); width:100%;
  text-align:left; font:inherit; color:inherit; border-left:0; border-right:0; border-bottom:0;
  position:relative;
}
.match:first-child{border-top:0}
button.match{cursor:pointer}
button.match::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--green); opacity:0; transition:opacity .14s ease}
button.match:hover{background:var(--soft)}
button.match:hover::before{opacity:1}
button.match:focus-visible{outline:2px solid var(--ink); outline-offset:-2px}
.match .when{font-family:var(--mono); font-size:13px; line-height:1.25; font-weight:600}
.match .when .ct{font-size:9.5px; color:var(--muted); letter-spacing:.06em; font-weight:400;
  text-transform:uppercase; margin-top:1px}
.match .who{min-width:0; font-family:var(--cond); font-size:16.5px; line-height:1.3; font-weight:500}
.match .who span{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.match .who .vs{font-family:var(--mono); font-size:9px; color:var(--muted); letter-spacing:.14em;
  text-transform:uppercase; margin:1px 0}
.match .who b{font-weight:700; color:var(--green-dd)}
.match .sc{font-family:var(--mono); font-size:17px; font-weight:600; text-align:right;
  white-space:nowrap; padding:4px 9px; border-radius:var(--r-s); background:var(--soft2);
  font-variant-numeric:tabular-nums}
.match .sc.empty{color:var(--muted); background:transparent; font-size:15px; padding-right:2px}
.match.live{background:var(--cream)}
.match.live::after{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--sun)}
.match.live .when{color:var(--sun-d)}

/* Beschriftungsbalken wie die Kacheln der Vereinsseite */
.roundhead{
  font-family:var(--cond); font-size:11px; font-weight:700; letter-spacing:.13em;
  text-transform:uppercase; color:#fff; background:var(--green-d); padding:7px 13px;
  text-align:center;
}

.live-wrap{display:grid; gap:11px; grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.livecard{background:var(--paper); border:1px solid var(--line); border-left:5px solid var(--sun);
  border-radius:var(--r); padding:13px 15px; box-shadow:var(--sh)}
.livecard .k{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--sun-d); font-weight:600}
.livecard .t{font-family:var(--sans); font-weight:800; font-style:italic; font-size:18px;
  margin-top:5px; line-height:1.3; letter-spacing:-.01em}
.livecard .m{font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:5px}

/* ---------- Tabellen ---------- */
.tw{overflow-x:auto; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--r); box-shadow:var(--sh)}
table{border-collapse:collapse; width:100%; font-size:14px}
th{background:var(--ink); color:#fff; font-family:var(--cond); font-weight:700; font-size:11px;
  letter-spacing:.09em; text-transform:uppercase; padding:9px 8px; text-align:right; white-space:nowrap}
th:nth-child(-n+2){text-align:left}
td{padding:9px 8px; border-top:1px solid var(--line); text-align:right; font-family:var(--mono);
  font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink-2)}
td:nth-child(2){text-align:left; font-family:var(--cond); font-size:15.5px; white-space:normal;
  min-width:120px; font-weight:600; color:var(--ink)}
td:first-child{text-align:left; color:var(--muted)}
tbody tr:nth-child(even){background:var(--soft)}
tbody tr:hover{background:var(--green-pale)}
td b{color:var(--ink)}
.badge{display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px;
  border-radius:99px; font-family:var(--mono); font-size:12px; font-weight:600}
.badge.b1{background:var(--sun); color:#3A2600}
.badge.b2{background:#D6D9DA; color:var(--ink)}
.badge.b3{background:var(--olive); color:#243109}
tr.p1 td{background:#FEF7E6}
tr.p1 td:nth-child(2){font-weight:700}
tr.p2 td{background:#F2F4F4}
tr.p3 td{background:#F2F7E9}

table.plan td{vertical-align:top}
table.plan td:nth-child(1){font-family:var(--mono); white-space:nowrap; font-weight:600}
table.plan td:nth-child(2){text-align:center; font-family:var(--mono)}
table.plan td.ph{text-align:left; font-family:var(--sans); font-size:12.5px; white-space:normal; min-width:130px}
table.plan td.ph .src{font-size:11px}
table.plan td.tm{text-align:left; font-family:var(--cond); font-size:15px; font-weight:600;
  white-space:normal; min-width:110px; color:var(--ink)}
table.plan td:last-child{font-family:var(--mono); font-weight:600; text-align:right}
table.plan tr.blockstart td{border-top:2px solid var(--line)}
table.plan tr.pause td{background:var(--cream); font-family:var(--cond); font-weight:700;
  text-align:center; letter-spacing:.04em; text-transform:uppercase; font-size:12px; color:#5A4A00}
table.plan tr.pause:hover td{background:var(--cream)}

table.plan td.du{text-align:left; font-family:var(--sans); font-size:12.5px; white-space:normal;
  min-width:90px; color:var(--ink-2)}
table.plan td.du .offen{color:var(--warn); font-weight:700}
button.mini{all:unset; cursor:pointer; font-family:var(--cond); font-size:11.5px; font-weight:600;
  color:var(--green-dd); padding:4px 7px; border:1px solid var(--line); border-radius:6px;
  white-space:nowrap; min-height:28px; display:inline-flex; align-items:center}
button.mini:hover{background:var(--green-pale)}
button.mini:focus-visible{outline:2px solid var(--ink); outline-offset:1px}
table.refs td{padding:5px 6px}
table.refs input,table.refs select{width:100%; min-width:70px; border:1px solid var(--line);
  border-radius:6px; padding:6px 7px; font-family:var(--mono); font-size:14px; background:var(--paper);
  color:var(--ink); min-height:36px}
table.refs td:first-child input{font-family:var(--cond); font-size:15px; font-weight:600; min-width:120px}
table.refs input:focus,table.refs select:focus{outline:0; border-color:var(--green)}

/* ---------- Formular ---------- */
.grid{display:grid; gap:11px; grid-template-columns:repeat(auto-fit,minmax(235px,1fr))}
.fld{background:var(--paper); border:1px solid var(--line); border-radius:var(--r);
  padding:9px 12px 7px; box-shadow:var(--sh-1)}
.fld label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:2px}
.fld input,.fld select{
  width:100%; border:0; border-bottom:2px solid var(--line); background:transparent;
  font-family:var(--mono); font-size:16px; color:var(--ink); padding:3px 0; min-height:30px;
}
.fld input:focus,.fld select:focus{outline:0; border-bottom-color:var(--green)}
.fld.name input{font-family:var(--cond); font-size:17.5px; font-weight:600}
.fld .code{font-family:var(--mono); font-size:10.5px; color:var(--green-dd);
  letter-spacing:.1em; font-weight:600}

.btn{
  all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  gap:6px; padding:11px 17px; min-height:44px; border-radius:var(--r-s); background:var(--green-d);
  color:#fff; font-family:var(--cond); font-weight:700; font-size:15px; box-shadow:var(--sh-1);
}
.btn:hover{background:var(--green-dd)}
.btn:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.btn.ghost{background:var(--paper); color:var(--ink); border:1px solid var(--line)}
.btn.ghost:hover{background:var(--green-pale); color:var(--green-dd)}
.btn.sm{padding:8px 12px; min-height:38px; font-size:14px}
.row{display:flex; gap:9px; flex-wrap:wrap; align-items:center}

.info{background:var(--paper); border:1px solid var(--line); border-left:4px solid var(--green);
  border-radius:var(--r); padding:12px 14px; font-size:13.5px; color:var(--ink-2); box-shadow:var(--sh-1)}
.info b{color:var(--ink)}
.info + .info{margin-top:9px}
.muted{color:var(--muted)}
small{font-size:12px}

/* ---------- Dialog ---------- */
.back{position:fixed; inset:0; background:rgba(20,26,21,.55); display:flex; align-items:flex-end;
  justify-content:center; z-index:60}
@media(min-width:640px){.back{align-items:center}}
.sheet{background:var(--paper); width:100%; max-width:470px; border-radius:14px 14px 0 0;
  padding:17px 17px calc(17px + env(safe-area-inset-bottom)); max-height:92vh; overflow:auto;
  box-shadow:0 -8px 40px rgba(20,26,21,.3)}
@media(min-width:640px){.sheet{border-radius:14px; box-shadow:0 20px 60px rgba(20,26,21,.32)}}
.sheet h3{font-size:19px}
.sheet .src{font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:.05em;
  text-transform:uppercase; margin-bottom:12px}
.setrow{display:grid; grid-template-columns:32px 1fr 1fr; gap:9px; align-items:center; margin-bottom:9px}
.setrow .n{font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:.06em}
.stp{display:flex; align-items:center; border:1px solid var(--line); border-radius:var(--r-s); overflow:hidden}
.stp button{all:unset; cursor:pointer; width:42px; min-height:48px; display:flex; align-items:center;
  justify-content:center; font-size:22px; font-family:var(--mono); color:var(--green-dd);
  background:var(--green-pale)}
.stp button:active{background:var(--olive)}
.stp button:focus-visible{outline:2px solid var(--ink); outline-offset:-2px}
.stp input{width:100%; min-width:0; border:0; text-align:center; font-family:var(--mono);
  font-size:21px; font-weight:600; min-height:48px; background:transparent; color:var(--ink)}
.stp input:focus{outline:0; background:var(--cream)}
.names{display:grid; grid-template-columns:32px 1fr 1fr; gap:9px; margin-bottom:7px}
.names div{font-family:var(--cond); font-weight:700; font-size:14px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.names div:first-child{visibility:hidden}

.pwrow input{width:100%; border:1px solid var(--line); border-radius:var(--r-s);
  padding:11px 12px; min-height:48px; font-family:var(--mono); font-size:17px; color:var(--ink);
  background:var(--paper)}
.pwrow input:focus{outline:0; border-color:var(--green); box-shadow:0 0 0 3px var(--green-pale)}
.check{display:flex; align-items:center; gap:9px; margin-top:6px; margin-bottom:6px; font-size:14px;
  color:var(--ink); cursor:pointer; min-height:34px}
.check .muted{font-size:12.5px}
.check input:disabled{opacity:.45}
.check:has(input:disabled){cursor:default; color:var(--muted)}
.check input{width:20px; height:20px; accent-color:var(--green)}
.pwmsg{color:#A32100; font-size:13px; margin:9px 0 0; min-height:1px; font-weight:500}

/* ---------- QR ---------- */
.qrbox{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:17px;
  display:flex; flex-direction:column; align-items:center; gap:11px; box-shadow:var(--sh)}
.qrbox svg{width:100%; max-width:310px; height:auto; image-rendering:pixelated;
  border:6px solid #fff; border-radius:3px}
.qrbox .cap{font-family:var(--mono); font-size:10.5px; color:var(--muted); text-align:center;
  word-break:break-all; line-height:1.5}

@media(max-width:520px){
  .match{grid-template-columns:50px 1fr auto; gap:9px; padding:10px 11px}
  .match .who{font-size:15.5px}
  .match .sc{font-size:16px; padding:3px 7px}
  main{padding:13px 9px 64px}
  .top h1{font-size:18px}
  .eyebrow{font-size:12px}
  .ribbon{padding:11px 11px 9px}
}
@media print{
  .top,nav,.btn,.qrbox,.row,.no-print{display:none!important}
  body{background:#fff}
  .card,.tw,.ribbon,.info{border-color:#999; box-shadow:none; break-inside:avoid}
  th,.roundhead{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}
@media(prefers-reduced-motion:no-preference){
  .back{animation:fade .16s ease both}
  .sheet{animation:rise .22s cubic-bezier(.2,.8,.25,1) both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{transform:translateY(14px); opacity:.4}to{transform:none; opacity:1}}
}

</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="topline"><span class="eyebrow" id="clb">STV Uerkheim</span><span class="sub" id="dte"></span></div>
    <h1 id="ttl">Beachvolleyball-Turnier</h1>
  </div>
  <div class="chips"><span class="chip" id="modeChip"></span><span class="chip" id="syncChip"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
/* ---------------------------------------------------------------
   Beachvolleyball-Turnier, 13 Teams
   Eine Datei, keine externen Abhaengigkeiten ausser den Schriften.

  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; }
  return s;
}

/* Zelle: {v, s, t}  t: 'n' Zahl, 'z' Uhrzeit (Anteil eines Tages), sonst Text */
function cellXml(c, ref) {
  if (c === null || c === undefined || c === '') return '';
  if (typeof c !== 'object') c = { v: c };
  const s = c.s ? ` s="${c.s}"` : '';
  if (c.t === 'n' || c.t === 'z') return `<c r="${ref}"${s}><v>${c.v}</v></c>`;
  return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xEsc(c.v)}</t></is></c>`;
}

function sheetXml(rows, opt) {
  opt = opt || {};
  const cols = (opt.cols || []).map((w, i) =>
    `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');
  const body = rows.map((r, ri) => {
    const cells = r.map((c, ci) => cellXml(c, colName(ci) + (ri + 1))).join('');
    const h = opt.rowHeights && opt.rowHeights[ri] ? ` ht="${opt.rowHeights[ri]}" customHeight="1"` : '';
    return cells ? `<row r="${ri + 1}"${h}>${cells}</row>` : '';
  }).join('');
  const freeze = opt.freeze
    ? `<sheetViews><sheetView workbookViewId="0" showGridLines="0"><pane ySplit="${opt.freeze}" topLeftCell="A${opt.freeze + 1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
    : '<sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews>';
  const merges = (opt.merges || []).length
    ? `<mergeCells count="${opt.merges.length}">${opt.merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>` : '';
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>${freeze}<sheetFormatPr defaultRowHeight="14"/>${cols ? `<cols>${cols}</cols>` : ''}<sheetData>${body}</sheetData>${merges}<printOptions horizontalCentered="1"/><pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.2" footer="0.2"/><pageSetup paperSize="9" orientation="${opt.landscape ? 'landscape' : 'portrait'}" fitToWidth="1" fitToHeight="0"/></worksheet>`;
}

function toWin(str) {
  const out = [];
  for (const ch of String(str == null ? '' : str)) {
    const cp = ch.codePointAt(0);
    if (cp === 10 || cp === 13) { out.push(cp); continue; }   // Struktur-Zeilenumbrüche erhalten
    if (cp === 9) { out.push(32); continue; }
    if (cp >= 32 && cp <= 126) out.push(cp);
    else if (WINANSI[cp] !== undefined) out.push(WINANSI[cp]);
    else if (cp >= 160 && cp <= 255) out.push(cp);
    else out.push(63);                       // Fragezeichen für Unbekanntes
  }

function pdfWidth(str, size, bold) {
  const w = bold ? PDFW.B : PDFW.R;

}

function pdfFit(str, size, bold, max) {

/* Seitenbauer: sammelt Zeichenbefehle, misst und bricht um */
function pdfDoc(opt) {
  opt = opt || {};
  const W = opt.landscape ? 842 : 595, H = opt.landscape ? 595 : 842;
  const pages = [];
  let buf = [];
  const doc = {
    W, H, margin: opt.margin || 34,
    y: 0,
    neu() { if (buf.length) pages.push(buf.join('\n')); buf = []; this.y = H - this.margin; },
    raw(s) { buf.push(s); },
    farbe(r, g, b) { buf.push(`${r} ${g} ${b} rg`); },
    strich(r, g, b) { buf.push(`${r} ${g} ${b} RG`); },
    rechteck(x, y, w, h) { buf.push(`${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); },
    linie(x1, y1, x2, y2, dicke) {
      buf.push(`${(dicke || 0.5).toFixed(2)} w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
    },
    text(x, y, s, size, bold) {
      buf.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${x.toFixed(2)} ${y.toFixed(2)} Td (${pdfEsc(s)}) Tj ET`);
    },
    textR(x, y, s, size, bold) { this.text(x - pdfWidth(s, size, bold), y, s, size, bold); },
    textC(x, y, s, size, bold) { this.text(x - pdfWidth(s, size, bold) / 2, y, s, size, bold); },
    fertig() { if (buf.length) pages.push(buf.join('\n')); buf = []; return pages; },
    setzeBild(b) { this.bild = b; },
    zeichneBild(x, y, w, h) { buf.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im1 Do Q`); },
  };

}

function b64bytes(b64) {
  const bin = atob(b64);
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}

/* Baut die Datei aus Byte-Stücken, damit eingebettete Bilder unversehrt bleiben */
function pdfBuild(doc, meta) {
  const pages = doc.fertig();
  const bild = doc.bild;                       // {w, h, b64} oder nichts
  const objs = [];
  const add = teile => { objs.push(Array.isArray(teile) ? teile : [teile]); return objs.length; };
  add(''); add('');                            // 1 Katalog, 2 Seitenbaum
  const fR = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const fB = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  let imId = 0;
  if (bild) {
    const roh = b64bytes(bild.b64);
    imId = add([`<< /Type /XObject /Subtype /Image /Width ${bild.w} /Height ${bild.h} ` +
      `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${roh.length} >>\nstream\n`,
      roh, '\nendstream']);
  }
  const kids = [];
  pages.forEach(inhalt => {
    const b = new Uint8Array(toWin(inhalt));
    const cid = add([`<< /Length ${b.length} >>\nstream\n`, b, '\nendstream']);
    const res = `<< /Font << /F1 ${fR} 0 R /F2 ${fB} 0 R >>` +
      (imId ? ` /XObject << /Im1 ${imId} 0 R >>` : '') + ' >>';
    const pid = add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${doc.W} ${doc.H}] ` +
      `/Resources ${res} /Contents ${cid} 0 R >>`);
    kids.push(`${pid} 0 R`);
  });
  objs[0] = ['<< /Type /Catalog /Pages 2 0 R >>'];
  objs[1] = [`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`];
  const info = add(`<< /Title (${pdfEsc((meta && meta.title) || 'Spielplan')}) /Producer (Turnier-App) >>`);

  const teile = [];
  let len = 0;
  const schreib = c => {
    const b = (typeof c === 'string') ? new Uint8Array(toWin(c)) : c;
    teile.push(b); len += b.length;
  };
  schreib('%PDF-1.4\n');
  const pos = [];
  objs.forEach((o, i) => {
    pos[i] = len;
    schreib(`${i + 1} 0 obj\n`);
    o.forEach(schreib);
    schreib('\nendobj\n');
  });
  const xref = len;
  schreib(`xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`);
  objs.forEach((o, i) => schreib(('0000000000' + pos[i]).slice(-10) + ' 00000 n \n'));
  schreib(`trailer\n<< /Size ${objs.length + 1} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out = new Uint8Array(len);
  let p = 0;
  teile.forEach(b => { out.set(b, p); p += b.length; });
  return out;
}

const GL = g => String.fromCharCode(65 + g);          // 0 -> 'A'
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const nMatches = n => n * (n - 1) / 2;

function roundRobin(n) {
  const t = [];
  for (let i = 0; i < n; i++) t.push(i);
  if (n % 2) t.push(-1);
  const m = t.length, rounds = [];
  let arr = t.slice();
  for (let r = 0; r < m - 1; r++) {
    const pairs = [];
    for (let i = 0; i < m / 2; i++) {
      const a = arr[i], b = arr[m - 1 - i];
      if (a >= 0 && b >= 0) pairs.push([a, b]);
    }
    if (pairs.length) rounds.push(pairs);
    arr = [arr[0], arr[m - 1]].concat(arr.slice(1, m - 1));
  }
  return rounds;
}

const _rrCache = {};
function rrFor(n) {
  if (!_rrCache[n]) _rrCache[n] = roundRobin(n);
  return _rrCache[n];
}
/* Flache Spielliste einer Gruppengrösse: {round, a, b} */
const _fxCache = {};
function fixtures(n) {
  if (!_fxCache[n]) {
    const out = [];
    rrFor(n).forEach((rd, ri) => rd.forEach(p => out.push({ round: ri, a: p[0], b: p[1] })));
    _fxCache[n] = out;
  }
  return _fxCache[n];
}

function hhmm(min) {
  min = Math.round(min);
  const h = Math.floor(min / 60) % 24, m = ((min % 60) + 60) % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function parseHHMM(s) {
  const m = /^(\d{1,2}):(\d{2})$/.exec((s || '').trim());
  if (!m) return null;
  const h = +m[1], mi = +m[2];
  if (h > 23 || mi > 59) return null;
  return h * 60 + mi;
}

/* ---- Zeitblöcke bilden: je Block laufen bis zu «courts» Partien parallel ---- */
function buildSlots(st) {
  const courts = clamp(st.courts | 0, 1, 6);
  const G = st.sizes.length;
  const rr = st.sizes.map(n => rrFor(n));
  // laufender Index jeder Partie innerhalb ihrer Gruppe, passend zu fixtures()
  const flat = rr.map(rs => { let k = 0; return rs.map(r => r.map(() => k++)); });
  const slots = [];

  if (st.mode === 'mixed') {
    const cur = new Array(G).fill(0), pos = new Array(G).fill(0);
    let turn = 0, guard = 0;
    const left = g => (cur[g] < rr[g].length) ? rr[g][cur[g]].length - pos[g] : 0;
    while (rr.some((rs, g) => cur[g] < rs.length) && guard++ < 5000) {
      const slot = [];
      let inner = 0;
      while (slot.length < courts && rr.some((_, g) => left(g) > 0) && inner++ < 200) {
        for (let k = 0; k < G && slot.length < courts; k++) {
          const g = (turn + k) % G;
          if (left(g) <= 0) continue;
          slot.push({ g, m: flat[g][cur[g]][pos[g]], round: cur[g] });
          pos[g]++;
        }
        turn = (turn + 1) % G;
      }
      for (let g = 0; g < G; g++) {
        if (cur[g] < rr[g].length && pos[g] >= rr[g][cur[g]].length) { cur[g]++; pos[g] = 0; }
      }
      if (!slot.length) break;
      slots.push(slot);
    }
  } else {
    for (let g = 0; g < G; g++) {
      rr[g].forEach((round, ri) => {
        for (let i = 0; i < round.length; i += courts) {
          const slot = [];
          for (let k = 0; k < courts && i + k < round.length; k++) {
            slot.push({ g, m: flat[g][ri][i + k], round: ri });
          }
          slots.push(slot);
        }
      });
    }
  }
  return slots;
}

/* Welche Stufen werden tatsächlich gespielt? Abhängigkeiten und Teamzahl entscheiden mit. */
function bracketPlan(st) {
  const total = totalTeams(st);
  let hf = !!st.hf;
  let qf = !!st.qf, kf = !!st.kf;
  if (!hf) { qf = false; kf = false; }        // ohne Halbfinal gibt es weder Viertelfinal noch Spiel um Platz 3
  if (qf && total < 8) qf = false;
  if (hf && total < 4) { hf = false; kf = false; }
  const fin = total >= 2;
  const need = qf ? 8 : (hf ? 4 : (fin ? 2 : 0));
  const games = [];
  if (qf) for (let i = 0; i < 4; i++) games.push({ id: i, stage: 'qf', nSets: 2, label: 'Viertelfinal ' + (i + 1), short: 'VF ' + (i + 1) });
  if (hf) for (let i = 0; i < 2; i++) games.push({ id: 4 + i, stage: 'hf', nSets: 2, label: 'Halbfinal ' + (i + 1), short: 'HF ' + (i + 1) });
  if (kf) games.push({ id: 6, stage: 'kf', nSets: 3, label: 'Kleiner Final · Platz 3/4', short: 'Platz 3/4' });
  if (fin) games.push({ id: 7, stage: 'fin', nSets: 3, label: 'Final · Platz 1/2', short: 'Final' });
  const off = [];
  if (st.qf && !qf) off.push(st.hf ? 'Viertelfinal (weniger als 8 Teams)' : 'Viertelfinal (ohne Halbfinal nicht möglich)');
  if (st.hf && !hf) off.push('Halbfinal (weniger als 4 Teams)');
  if (st.kf && !kf) off.push('Kleiner Final (ohne Halbfinal nicht möglich)');
  return { qf, hf, kf, fin, need, games, off };
}

/* Wo liegt die Pause? Verankert am Abschluss einer Gruppe, nicht an einer
   Zeitblocknummer - sonst verrutscht sie bei jeder Strukturänderung. */
function pauseSlot(st, slots) {
  if (st.lunch <= 0) return 0;
  const pa = st.pauseAfter || 'g0';
  if (pa === 'none') return 0;
  let idx = -1;
  if (pa === 'half') idx = Math.floor(slots.length / 2) - 1;
  else {
    const m = /^g(\d+)$/.exec(pa);
    if (m) {
      const g = +m[1];
      for (let i = 0; i < slots.length; i++) if (slots[i].some(x => x.g === g)) idx = i;
    }
  }
  if (idx < 0 || idx >= slots.length - 1) return 0;   // am Ende der Gruppenphase bringt eine Pause nichts
  return idx + 1;
}

function schedule(st) {
  const slots = buildSlots(st);
  const matches = [];
  let t = st.start, groupEnd = st.start, lunchFrom = null, lunchTo = null;
  const lunchAt = pauseSlot(st, slots);

  slots.forEach((slot, si) => {
    slot.forEach((m, k) => matches.push({
      g: m.g, idx: m.m, round: m.round, slot: si, court: k + 1,
      from: t, to: t + st.dGroup,
      nameA: (st.names[m.g] || [])[fixtures(st.sizes[m.g])[m.m].a],
      nameB: (st.names[m.g] || [])[fixtures(st.sizes[m.g])[m.m].b],
      res: (st.res[m.g] || [])[m.m] || null,
    }));
    const end = t + st.dGroup;
    groupEnd = end;
    if (si === slots.length - 1) return;
    if (si + 1 === lunchAt) { lunchFrom = end; lunchTo = end + st.lunch; t = lunchTo; }
    else t = end + st.pGroup;
  });
  if (!slots.length) groupEnd = st.start;

  const courts = clamp(st.courts | 0, 1, 6);
  const plan = bracketPlan(st);
  const dur = { qf: st.dQuarter, hf: st.dSemi, kf: st.dFinal, fin: st.dFinal };
  const F = [];
  let ft = groupEnd;
  ['qf', 'hf', 'kf', 'fin'].forEach(stg => {
    const gs = plan.games.filter(g => g.stage === stg);
    if (!gs.length) return;
    const d = dur[stg];
    // Kleiner Final und Final laufen bewusst allein, damit alle zuschauen können
    const perSlot = (stg === 'kf' || stg === 'fin') ? 1 : courts;
    for (let i = 0; i < gs.length; i += perSlot) {
      ft += st.pFinal;
      for (let k = 0; k < perSlot && i + k < gs.length; k++) {
        F.push(Object.assign({}, gs[i + k], { court: k + 1, from: ft, to: ft + d }));
      }
      ft += d;
    }
  });
  const end = F.length ? Math.max(...F.map(g => g.to)) : groupEnd;

  return {
    slots, matches, groupStart: st.start, groupEnd,
    lunchFrom, lunchTo, lunchSlot: lunchAt, F, plan, end,
    byGroup: st.sizes.map((_, g) => matches.filter(m => m.g === g)),
  };
}

/* ---- Tabelle einer Gruppe ---- */
function standings(st, g) {
  const names = st.names[g] || [], res = st.res[g] || [], fx = fixtures(st.sizes[g]);
  const rows = names.map((name, i) => ({ i, g, name, sp: 0, w: 0, d: 0, l: 0, pts: 0, pf: 0, pa: 0, diff: 0 }));
  fx.forEach((f, idx) => {
    const r = res[idx];
    if (!r || r[0] === null || r[1] === null) return;
    const ra = rows[f.a], rb = rows[f.b];
    if (!ra || !rb) return;
    const [x, y] = r;
    ra.sp++; rb.sp++; ra.pf += x; ra.pa += y; rb.pf += y; rb.pa += x;
    if (x > y) { ra.w++; rb.l++; } else if (y > x) { rb.w++; ra.l++; } else { ra.d++; rb.d++; }
  });
  rows.forEach(r => {
    r.pts = r.w * st.win + r.d * st.draw + r.l * st.loss;
    r.diff = r.pf - r.pa;
    r.ppg = r.sp ? r.pts / r.sp : 0;
    r.dpg = r.sp ? r.diff / r.sp : 0;
  });
  const sorted = rows.slice().sort((p, q) => q.pts - p.pts || q.diff - p.diff || q.pf - p.pf || p.i - q.i);
  sorted.forEach((r, k) => { r.rank = k + 1; });
  return sorted;
}

/* Sind zwei Teams anhand von Resultaten und Punkten überhaupt unterscheidbar?
   Innerhalb einer Gruppe zählen Punkte, Differenz und erzielte Punkte; über Gruppen
   hinweg der Gruppenrang und die Werte pro Spiel. */
function gleichwertig(a, b) {
  if (!a || !b) return false;
  if (a.g === b.g) return a.pts === b.pts && a.diff === b.diff && a.pf === b.pf;
  return a.rank === b.rank &&
    Math.abs(a.ppg - b.ppg) < 1e-9 && Math.abs(a.dpg - b.dpg) < 1e-9;
}

/* ---- Gesamtreihenfolge: erst Gruppenrang, dann Punkte pro Spiel ---- */
function overallOrder(st) {
  const tabs = st.sizes.map((_, g) => standings(st, g));
  const out = [];
  const maxRank = Math.max(0, ...st.sizes);
  for (let r = 1; r <= maxRank; r++) {
    const at = [];
    tabs.forEach((t, g) => { const row = t.find(x => x.rank === r); if (row) at.push(row); });
    at.sort((a, b) => b.ppg - a.ppg || b.dpg - a.dpg || a.g - b.g);
    out.push(...at);
  }
  return out;
}

function evalMatch(sets, nSets, nameA, nameB) {
  let sa = 0, sb = 0, ta = 0, tb = 0, any = false;
  for (let i = 0; i < nSets; i++) {
    const s = sets[i];
    if (!s || s[0] === null || s[1] === null) continue;
    any = true; ta += s[0]; tb += s[1];
    if (s[0] > s[1]) sa++; else if (s[1] > s[0]) sb++;
  }
  let winner = null, loser = null, tie = false;
  if (any) {
    if (sa > sb) { winner = nameA; loser = nameB; }
    else if (sb > sa) { winner = nameB; loser = nameA; }
    else if (ta > tb) { winner = nameA; loser = nameB; }
    else if (tb > ta) { winner = nameB; loser = nameA; }
    else tie = true;
  }
  return { sa, sb, ta, tb, winner, loser, tie, played: any };
}

/* ---- Finalrunde: die vier besten Teams über alle Gruppen, 1-4 und 2-3 ---- */
/* Erst wenn jede Gruppenpartie erfasst ist, stehen die Qualifikanten fest.
   Vorher wären Namen in der Endrunde frei erfunden. */
function groupsDone(st) {
  return st.sizes.every((n, g) => {
    const need = nMatches(n), res = st.res[g] || [];
    for (let i = 0; i < need; i++) if (!res[i]) return false;
    return true;
  });
}

/* Setzung: Standardpaarungen, aber so gedreht, dass möglichst keine zwei
   Teams derselben Gruppe schon vor dem Final aufeinandertreffen. */
function perms(a) {
  if (a.length <= 1) return [a.slice()];
  const out = [];
  a.forEach((v, i) => perms(a.slice(0, i).concat(a.slice(i + 1))).forEach(r => out.push([v].concat(r))));
  return out;
}
function seedPairs(seeds, plan, optimize) {
  if (!plan.hf) return seeds.length >= 2 ? [[0, 1]] : [];
  const top = plan.qf ? [0, 3, 1, 2] : [0, 1];
  const bot = plan.qf ? [7, 4, 6, 5] : [3, 2];
  let best = bot;
  if (optimize !== false) {
    let bestC = Infinity;
    perms(bot).forEach(p => {
      let c = 0;
      for (let i = 0; i < top.length; i++) {
        const a = seeds[top[i]], b = seeds[p[i]];
        if (a && b && a.g === b.g) c++;
      }
      if (c < bestC) { bestC = c; best = p; }
    });
  }
  const paare = top.map((t, i) => [t, best[i]]);
  // Bei genau zwei Gruppen: die Paarung mit dem Sieger der Gruppe A zuerst,
  // sonst wechselte «Halbfinal 1» je nach Resultatlage die Bedeutung.
  if (!plan.qf && paare.length === 2) {
    const istA1 = i => seeds[i] && seeds[i].g === 0 && seeds[i].rank === 1;
    if (istA1(paare[1][0]) || istA1(paare[1][1])) return [paare[1], paare[0]];
  }
  return paare;
}

/* Endrunde: Teilnehmer, Resultate, Sieger */
function knockout(st, sched) {
  const plan = sched.plan;
  const order = overallOrder(st);
  const seeds = order.slice(0, plan.need);
  const done = groupsDone(st);
  const pairs = seedPairs(seeds, plan, done);
  const games = sched.F.map(f => Object.assign({}, f));
  const byId = {};
  games.forEach(g => { byId[g.id] = g; });
  // Bei zwei Gruppen ohne Viertelfinal steht die Überkreuz-Paarung strukturell fest,
  // auch ohne Resultate: Gruppensieger gegen Zweiten der anderen Gruppe.
  const fest = st.sizes.length === 2 && !plan.qf && plan.hf;
  const ordn = r => r === 1 ? 'Erster' : r === 2 ? 'Zweiter' : r + '.';
  const platzText = i => (fest && seeds[i]) ? `${ordn(seeds[i].rank)} Gruppe ${GL(seeds[i].g)}`
    : 'Setzplatz ' + (i + 1);
  const nameOf = i => (done && seeds[i]) ? seeds[i].name : platzText(i);
  const srcOf = i => (done && seeds[i])
    ? `${seeds[i].rank}. Gruppe ${GL(seeds[i].g)}`
    : (fest ? platzText(i) : 'steht nach der Gruppenphase fest');

  const setUp = (g, a, b, sa, sb) => {
    g.nameA = a; g.srcA = sa; g.nameB = b; g.srcB = sb;
    g.sets = st.rF[g.id] || [null, null, null];
    g.ev = evalMatch(g.sets, g.nSets, g.nameA, g.nameB);
  };

  if (plan.qf) {
    for (let i = 0; i < 4; i++) {
      const p = pairs[i] || [0, 0];
      setUp(byId[i], nameOf(p[0]), nameOf(p[1]), srcOf(p[0]), srcOf(p[1]));
    }
    setUp(byId[4], byId[0].ev.winner || 'Sieger VF 1', byId[1].ev.winner || 'Sieger VF 2',
      'Sieger VF 1', 'Sieger VF 2');
    setUp(byId[5], byId[2].ev.winner || 'Sieger VF 3', byId[3].ev.winner || 'Sieger VF 4',
      'Sieger VF 3', 'Sieger VF 4');
  } else if (plan.hf) {
    [0, 1].forEach(i => {
      const p = pairs[i] || [0, 0];
      setUp(byId[4 + i], nameOf(p[0]), nameOf(p[1]), srcOf(p[0]), srcOf(p[1]));
    });
  }
  if (plan.kf) {
    setUp(byId[6], byId[4].ev.loser || 'Verlierer Halbfinal 1', byId[5].ev.loser || 'Verlierer Halbfinal 2',
      'Verlierer Halbfinal 1', 'Verlierer Halbfinal 2');
  }
  if (plan.fin) {
    if (plan.hf) {
      setUp(byId[7], byId[4].ev.winner || 'Sieger Halbfinal 1', byId[5].ev.winner || 'Sieger Halbfinal 2',
        'Sieger Halbfinal 1', 'Sieger Halbfinal 2');
    } else {
      const p = pairs[0] || [0, 1];
      setUp(byId[7], nameOf(p[0]), nameOf(p[1]), srcOf(p[0]), srcOf(p[1]));
    }
  }
  const tabs = st.sizes.map((_, g) => standings(st, g));
  return { games, byId, seeds, order, tabs, plan, done, enough: seeds.length >= 2 };
}
const finalRound = knockout;   // bisheriger Name

function finalRanking(st, sched) {
  const ko = knockout(st, sched);
  const { plan, byId, seeds, order } = ko;
  const list = [];
  const add = (place, name, why) => list.push({ place, name: name || null, why });
  const seedPos = n => { const i = order.findIndex(r => r.name === n); return i < 0 ? 1e6 : i; };
  const bySeed = arr => arr.slice().sort((a, b) => seedPos(a) - seedPos(b));

  let next = 1;
  if (plan.fin) {
    add(next++, byId[7].ev.winner, 'Sieger Final');
    add(next++, byId[7].ev.loser, 'Verlierer Final');
  }
  if (plan.kf) {
    add(next++, byId[6].ev.winner, 'Sieger kleiner Final');
    add(next++, byId[6].ev.loser, 'Verlierer kleiner Final');
  } else if (plan.hf) {
    bySeed([byId[4].ev.loser, byId[5].ev.loser].filter(Boolean))
      .forEach(n => add(next++, n, 'Halbfinal verloren · nach Setzung'));
    while (next <= 4) add(next++, null, 'Halbfinal verloren · nach Setzung');
  }
  if (plan.qf) {
    bySeed([0, 1, 2, 3].map(i => byId[i].ev.loser).filter(Boolean))
      .forEach(n => add(next++, n, 'Viertelfinal verloren · nach Setzung'));
    while (next <= 8) add(next++, null, 'Viertelfinal verloren · nach Setzung');
  }
  const inKO = new Set(seeds.map(s => s.g + '#' + s.i));
  const rest = order.filter(r => !inKO.has(r.g + '#' + r.i));
  const done = groupsDone(st);
  if (!done) {
    // Ohne vollständige Gruppenphase ist keine einzige Platzierung entschieden
    rest.forEach(() => add(next++, null, 'steht nach der Gruppenphase fest'));
  } else {
    const platz = [];
    rest.forEach((r, k) => {
      platz[k] = (k > 0 && gleichwertig(rest[k - 1], r)) ? platz[k - 1] : next + k;
    });
    rest.forEach((r, k) => {
      const punktgleich = (k > 0 && platz[k] === platz[k - 1]) ||
        (k < rest.length - 1 && platz[k + 1] === platz[k]);
      add(platz[k], r.name, punktgleich
        ? `${r.rank}. Gruppe ${GL(r.g)} · punktgleich, Reihenfolge offen`
        : `${r.rank}. Gruppe ${GL(r.g)} · ${r.ppg.toFixed(2)} Pkt/Spiel`);
      if (punktgleich) list[list.length - 1].punktgleich = true;
    });
    next += rest.length;
  }

  const info = n => {
    if (!n) return null;
    for (let gi = 0; gi < ko.tabs.length; gi++) {
      const row = ko.tabs[gi].find(x => x.name === n);
      if (row) return { grp: GL(gi), gRank: row.rank, pts: row.pts, diff: row.diff };
    }
    return null;
  };
  list.forEach(e => {
    const i = info(e.name);
    // Platzhalter wie «Sieger VF 3» sind keine Teams: solange eine Vorrunde offen
    // ist, bleibt der Platz offen statt einen Namen vorzutäuschen.
    if (!i) { e.name = null; e.unresolved = true; }
    else Object.assign(e, i);
  });
  return { list, games: ko.games, byId, tabs: ko.tabs, seeds, plan, done: ko.done, enough: ko.enough };
}

/* ---- Struktur an geänderte Gruppen-/Teamzahlen anpassen ---- */
function normalize(st) {
  let G = clamp((st.sizes || []).length, 1, MAXG);
  st.sizes = (st.sizes || []).slice(0, G).map(n => clamp(n | 0, MINSZ, MAXSZ));
  while (st.sizes.length < G) st.sizes.push(4);
  st.names = st.names || [];
  st.res = st.res || [];
  st.names.length = G; st.res.length = G;
  for (let g = 0; g < G; g++) {
    const n = st.sizes[g];
    const old = st.names[g] || [];
    const arr = [];
    for (let i = 0; i < n; i++) arr.push(old[i] || `Team ${GL(g)}${i + 1}`);
    st.names[g] = arr;
    const need = nMatches(n), oldr = st.res[g] || [];
    const rs = [];
    for (let i = 0; i < need; i++) rs.push(oldr[i] || null);
    st.res[g] = rs;
  }
  const g = Object.assign({ on: false, owner: '', repo: '', branch: 'main', path: 'data.json' }, st.gh || {});
  g.on = !!g.on;
  ['owner', 'repo', 'branch', 'path'].forEach(k => {
    g[k] = String(g[k] || '').replace(/[^A-Za-z0-9._\/-]/g, '').slice(0, 100);
  });
  g.branch = g.branch || 'main'; g.path = g.path || 'data.json';
  st.gh = g;
  // Personen und Einteilung säubern
  let maxId = 0;
  st.refs = (st.refs || []).slice(0, 60).map(p => {
    p = p || {};
    const m = /^p(\d+)$/.exec(p.id || '');
    if (m) maxId = Math.max(maxId, +m[1]);
    return p;
  });
  st.refs.forEach(p => {
    if (!/^p\d+$/.test(p.id || '')) p.id = 'p' + (++maxId);
    p.n = String(p.n || '').replace(/[|~\r\n\u0001]/g, ' ').trim().slice(0, 40);
    p.f = Math.max(0, Math.min(1439, p.f | 0));
    p.t = Math.max(0, Math.min(1439, p.t | 0));
    if (p.t < p.f) p.t = p.f;
    p.r = (p.r === 's' || p.r === 't') ? p.r : 'b';
    const tm = /^(\d+)-(\d+)$/.exec(String(p.tm || ''));
    p.tm = (tm && +tm[1] < st.sizes.length && +tm[2] < st.sizes[+tm[1]]) ? p.tm : '';
  });
  const ids = new Set(st.refs.map(p => p.id));
  const duty = {};
  Object.keys(st.duty || {}).forEach(k => {
    const v = (st.duty[k] || []).slice(0, 3).map(x => ids.has(x) ? x : null);
    while (v.length < 3) v.push(null);
    if (v.some(Boolean)) duty[k] = v;
  });
  st.duty = duty;
  st.mode = st.mode === 'mixed' ? 'mixed' : 'block';
  st.hf = !!st.hf;
  st.qf = !!st.qf && st.hf;
  st.kf = !!st.kf && st.hf;
  st.rF = (st.rF || []).slice(0, 8);
  while (st.rF.length < 8) st.rF.push([null, null, null]);
  st.rF = st.rF.map(x => { const y = (x || []).slice(0, 3); while (y.length < 3) y.push(null); return y; });
  st.courts = clamp(st.courts | 0, 1, 6);
  st.prepSlots = Math.max(0, Math.min(3, st.prepSlots | 0));
  const pa = String(st.pauseAfter === undefined ? 'g0' : st.pauseAfter);
  const gm = /^g(\d+)$/.exec(pa);
  st.pauseAfter = (pa === 'none' || pa === 'half') ? pa
    : (gm && +gm[1] < st.sizes.length) ? pa : 'g0';
  return st;
}

/* ---- Einteilung von Schiedsrichtern und Täfelern ---- */
const DUTY_ROLES = ['Schiedsrichter', 'Täfeler 1', 'Täfeler 2'];
const ROLE_LABEL = { b: 'Schiedsrichter und Täfeler', s: 'nur Schiedsrichter', t: 'nur Täfeler' };
const ROLE_SHORT = { b: 'beides', s: 'Schiedsrichter', t: 'Täfeler' };
/* Darf diese Person den Posten übernehmen? Posten 0 ist der Schiedsrichter. */
const canRole = (p, slot) => (p.r || 'b') === 'b' || (slot === 0 ? p.r === 's' : p.r === 't');
const matchKey = m => (m.stage ? 'f' + m.id : 'g' + m.g + '-' + m.idx);

/* Alle Partien chronologisch, mit Schlüssel und Teamnamen */
function dutyMatches(st, sched, ko) {
  const list = sched.matches.map(m => ({
    key: matchKey(m), from: m.from, to: m.to, court: m.court,
    a: m.nameA, b: m.nameB, g: m.g,
    label: 'Gruppe ' + GL(m.g) + ' · Runde ' + (m.round + 1),
  }));
  (ko ? ko.games : sched.F).forEach(g => list.push({
    key: 'f' + g.id, from: g.from, to: g.to, court: g.court,
    a: g.nameA, b: g.nameB, g: -1, label: g.label,
  }));
  return list.sort((x, y) => x.from - y.from || x.court - y.court);
}

/* Zeitblöcke, in denen eine Person keinen Posten übernehmen soll, weil sie sich
   auf ihr eigenes Spiel vorbereitet. */
function prepBlocks(st, sched, ko, person) {
  const n = Math.max(0, st.prepSlots | 0);
  if (!n || !person.tm) return new Set();
  const x = person.tm.split('-').map(Number);
  const name = ((st.names[x[0]] || [])[x[1]]) || null;
  if (!name) return new Set();
  const games = dutyMatches(st, sched, ko);
  const starts = [...new Set(games.map(g => g.from))].sort((a, b) => a - b);
  const out = new Set();
  games.filter(g => g.a === name || g.b === name).forEach(g => {
    const i = starts.indexOf(g.from);
    for (let k = 1; k <= n && i - k >= 0; k++) out.add(starts[i - k]);
  });
  return out;
}

/* Wann spielt eine Person selbst? Dann kann sie nirgends eingeteilt werden. */
function ownPlayTimes(st, sched, person) {
  if (!person.tm) return [];
  const p = person.tm.split('-').map(Number);
  const name = ((st.names[p[0]] || [])[p[1]]) || null;
  if (!name) return [];
  return sched.matches.filter(m => m.g === p[0] && (m.nameA === name || m.nameB === name))
    .map(m => ({ from: m.from, to: m.to }));
}

function assignDuty(st, sched, ko) {
  const refs = (st.refs || []).filter(p => p.n);
  const games = dutyMatches(st, sched, ko);
  const busy = {}, load = {}, last = {}, prep = {};
  refs.forEach(p => {
    busy[p.id] = ownPlayTimes(st, sched, p); load[p.id] = 0; last[p.id] = -1;
    prep[p.id] = prepBlocks(st, sched, ko, p);
  });
  const teamName = p => { if (!p.tm) return null; const x = p.tm.split('-').map(Number); return (st.names[x[0]] || [])[x[1]] || null; };
  const overlaps = (id, m) => (busy[id] || []).some(b => b.from < m.to && m.from < b.to);
  const out = {};
  games.forEach(m => {
    const taken = [];
    for (let r = 0; r < 3; r++) {
      const cand = refs.filter(p =>
        taken.indexOf(p.id) < 0 &&
        canRole(p, r) &&
        p.f <= m.from && p.t >= m.to &&
        !overlaps(p.id, m) &&
        !prep[p.id].has(m.from) &&
        teamName(p) !== m.a && teamName(p) !== m.b);
      if (!cand.length) { taken.push(null); continue; }
      // Erst die gleichmässige Last, dann Fachleute vor Allroundern: so bleiben
      // die vielseitigen Personen für die knapperen Posten übrig.
      const spez = p => ((p.r || 'b') === 'b' ? 1 : 0);
      cand.sort((x, y) => load[x.id] - load[y.id] || spez(x) - spez(y) ||
        last[x.id] - last[y.id] || refs.indexOf(x) - refs.indexOf(y));
      const p = cand[0];
      taken.push(p.id);
      load[p.id]++; last[p.id] = m.to;
      busy[p.id].push({ from: m.from, to: m.to });
    }
    out[m.key] = taken;
  });
  return out;
}

/* Wie knapp ist es wirklich? Zählt je Zeitblock, wer verfügbar ist -
   Gesamtzahlen täuschen, wenn in Schichten gearbeitet wird. */
function dutyCoverage(st, sched, ko) {
  const refs = (st.refs || []).filter(p => p.n);
  const games = dutyMatches(st, sched, ko);
  const teamName = p => { if (!p.tm) return null; const x = p.tm.split('-').map(Number); return (st.names[x[0]] || [])[x[1]] || null; };
  const prepAll = {};
  refs.forEach(p => { prepAll[p.id] = prepBlocks(st, sched, ko, p); });
  const blocks = {};
  games.forEach(g => { (blocks[g.from] = blocks[g.from] || []).push(g); });
  let worst = null;
  Object.keys(blocks).map(Number).sort((a, b) => a - b).forEach(from => {
    const gs = blocks[from], to = Math.max(...gs.map(g => g.to));
    const frei = refs.filter(p => p.f <= from && p.t >= to &&
      !prepAll[p.id].has(from) &&
      !sched.matches.some(q => {
        const nm = teamName(p);
        return nm && (q.nameA === nm || q.nameB === nm) && q.from < to && from < q.to;
      }));
    const haveS = frei.filter(p => canRole(p, 0)).length;
    const haveT = frei.filter(p => canRole(p, 1)).length;
    const needS = gs.length, needT = gs.length * 2;
    const fehlt = Math.max(0, needS - haveS) + Math.max(0, needT - haveT);
    if (!worst || fehlt > worst.fehlt) worst = { from, to, haveS, haveT, needS, needT, fehlt };
  });
  return worst || { from: 0, to: 0, haveS: 0, haveT: 0, needS: 0, needT: 0, fehlt: 0 };
}

function dutyStats(st, sched, ko) {
  const refs = (st.refs || []).filter(p => p.n);
  const games = dutyMatches(st, sched, ko);
  const duty = st.duty || {};
  const cnt = {}, byRole = {};
  refs.forEach(p => { cnt[p.id] = 0; byRole[p.id] = [0, 0, 0]; });
  let open = 0, total = games.length * 3;
  games.forEach(m => {
    const d = duty[m.key] || [null, null, null];
    for (let r = 0; r < 3; r++) {
      if (!d[r] || cnt[d[r]] === undefined) { open++; continue; }
      cnt[d[r]]++; byRole[d[r]][r]++;
    }
  });
  const rows = refs.map(p => ({ id: p.id, n: p.n, f: p.f, t: p.t, tm: p.tm, r: p.r || 'b',
    cnt: cnt[p.id], byRole: byRole[p.id] }));
  return { rows, open, total, games };
}

const totalTeams = st => st.sizes.reduce((a, n) => a + n, 0);
const totalGroupMatches = st => st.sizes.reduce((a, n) => a + nMatches(n), 0);


/* ================= Zustand & Speicher ================= */
const KEY = 'bvt13:state';

const UNLOCK = 'bvt13:unlock';
let memUnlock = '';
function isUnlocked() {
  if (!st.pwHash) return true;
  try { if (sessionStorage.getItem(UNLOCK) === st.pwHash) return true; } catch (e) { /* egal */ }
  try { if (localStorage.getItem(UNLOCK) === st.pwHash) return true; } catch (e) { /* egal */ }
  return memUnlock === st.pwHash;
}
function setUnlocked(on, remember) {
  memUnlock = on ? st.pwHash : '';
  try { sessionStorage.removeItem(UNLOCK); } catch (e) { /* egal */ }
  try { localStorage.removeItem(UNLOCK); } catch (e) { /* egal */ }
  if (!on) return;
  try { (remember ? localStorage : sessionStorage).setItem(UNLOCK, st.pwHash); } catch (e) { /* egal */ }
}

const Store = {
  mode: 'memory', mem: null,
  detect() {
    try {
      if (window.storage && typeof window.storage.get === 'function') { this.mode = 'shared'; return; }
    } catch (e) { /* ignorieren */ }
    try {
      localStorage.setItem('__probe', '1'); localStorage.removeItem('__probe');
      this.mode = 'local';
    } catch (e) { this.mode = 'memory'; }
  },
  async get() {
    if (this.mode === 'shared') {
      try { const r = await window.storage.get(KEY, true); return r && r.value ? JSON.parse(r.value) : null; }
      catch (e) { return null; }
    }
    if (this.mode === 'local') {
      try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; }
    }
    return this.mem;
  },
  async set(o) {
    const s = JSON.stringify(o);
    if (this.mode === 'shared') { try { await window.storage.set(KEY, s, true); return true; } catch (e) { return false; } }
    if (this.mode === 'local') { try { localStorage.setItem(KEY, s); return true; } catch (e) { return false; } }
    this.mem = o; return true;
  }
};

function merge(raw) {
  const s = JSON.parse(JSON.stringify(DEFAULTS));
  if (!raw || typeof raw !== 'object') return normalize(s);
  // Altbestand mit fixen zwei Gruppen uebernehmen
  if (raw.teamsA || raw.teamsB) {
    raw = Object.assign({}, raw, {
      sizes: [(raw.teamsA || []).length || 6, (raw.teamsB || []).length || 7],
      names: [raw.teamsA || [], raw.teamsB || []],
      res: [raw.rA || [], raw.rB || []],
      mode: 'block', lunchAfter: raw.lunchAfter === undefined ? 5 : raw.lunchAfter,
    });
  }
  for (const k of Object.keys(DEFAULTS)) if (raw[k] !== undefined) s[k] = raw[k];
  s.ts = raw.ts || 0;
  return normalize(s);   // normalize() bringt rF auf die volle Länge von acht Spielen
}

let saveTimer = null;

/* ================= Live-Abgleich über GitHub =================

const GH_TOK = 'bvt13:ghtoken';

function b64plain(str) {
